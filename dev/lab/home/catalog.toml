# What the emulators are. Irori never reads this file.
# `irori_id` is the devices.toml key: protocol, then the handle, slugged.
# Zigbee `model` / `vendor` are the Home Assistant display strings. `zigbee_model`
# and `manufacturer_name` are what the Basic cluster must answer so Zigbee2MQTT
# 2.14.1's converters pick that display model. Empty until that lookup is filled in.

zigbee2mqtt_version = "2.14.1"

[[zigbee]]
irori_id = "zigbee_0x0211000000000001"
ieee = "0x0211000000000001"
name = "Main living room switch"
vendor = "SONOFF"
