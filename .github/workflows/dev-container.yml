name: Dev container

# Keeps dev/ (the Raspberry Pi-like container) from rotting. Runs when anything the image
# builds from changes (skipped for docs-only changes). Builds for the runner's native amd64
# to stay fast; arm64 is what developers run locally, and the arm64 binary itself is
# covered by ci.yml under QEMU.
on:
  push:
    branches: [main]
    paths:
      - "dev/**"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - ".cargo/**"
      - "Cargo.lock"
      - "crates/**"
      - "extensions/**"
      - "extras/**"
      - "xtask/**"
      - ".github/workflows/dev-container.yml"
  pull_request:
    paths:
      - "dev/**"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - ".cargo/**"
      - "Cargo.lock"
      - "crates/**"
      - "extensions/**"
      - "extras/**"
      - "xtask/**"
      - ".github/workflows/dev-container.yml"

# The job reads the repo. It may also write the Actions cache, and only a push
# to main does. A pull request restores that cache and does not save one, so a
# pull request's build scripts cannot leave objects for the next build. main
# does not read a cache a pull request saved. A fork's token is read-only, so
# it cannot write one either. actions: write is the cache, not the repository.
permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-image:
    name: build · run · smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build scripts and tests from the PR run in this job; don't leave a token on disk.
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # The exact key changes every commit, so a push to main can save a new
      # cache. A pull request misses that key and takes the newest prefix,
      # which is main's cache for this lockfile, or an older one if the
      # lockfile moved.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/irori-dev-cargo
          key: irori-dev-container-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            irori-dev-container-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            irori-dev-container-${{ runner.os }}-${{ runner.arch }}-
      - name: Inject cargo cache
        run: dev/ci-cargo-cache.sh inject "${{ runner.temp }}/irori-dev-cargo"
      - name: Build and start (native platform)
        run: |
          # compose.yaml pins linux/arm64; override it for the amd64 runner.
          cat > dev/compose.ci.yaml <<'EOF'
          services:
            pi:
              platform: linux/amd64
          EOF
          docker compose -f dev/compose.yaml -f dev/compose.ci.yaml up --build --detach --wait pi
      - name: Smoke test
        run: dev/smoke-test.sh http://127.0.0.1:8480 30
      - name: Logs
        if: always()
        run: docker compose -f dev/compose.yaml logs pi
      # After the image has already been tested. A cache that is too big for
      # GitHub's limit must not fail the job.
      - name: Extract cargo cache
        id: extract-cargo
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: dev/ci-cargo-cache.sh extract "${{ runner.temp }}/irori-dev-cargo"
      - name: Save cargo cache
        if: success() && steps.extract-cargo.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/irori-dev-cargo
          key: irori-dev-container-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
