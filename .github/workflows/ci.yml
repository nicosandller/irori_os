name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt · clippy · test · dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build scripts and tests from the PR run in this job; don't leave a token on disk.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: clippy (barebones, no default features)
        run: cargo clippy --locked -p irori --no-default-features --all-targets -- -D warnings
      - name: test (all features)
        run: cargo test --locked --workspace --all-features
      - name: test (barebones, no default features)
        run: cargo test --locked -p irori --no-default-features
      - name: dependency rules (ROADMAP §2.1)
        run: cargo xtask check-deps
      - name: JSON Schemas match irori-types
        run: cargo xtask schemas --check
      - name: Docs match the build (default features)
        run: cargo xtask check-docs

  # Builds the Leptos app to wasm. This is also the wasm32 check for `irori-types`: the UI
  # compiles it into the browser bundle, which is the point of keeping those types portable.
  ui:
    name: web UI · wasm build and download budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build scripts and tests from the PR run in this job; don't leave a token on disk.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          # This job runs its own fmt and clippy; don't rely on the runner image carrying them.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The UI is outside the workspace and has its own target dir.
          workspaces: |
            .
            crates/irori-ui
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # The UI is outside the workspace, so the check job's fmt and clippy don't reach it.
      - name: rustfmt
        run: cargo fmt --manifest-path crates/irori-ui/Cargo.toml --all --check
      - name: clippy
        run: |
          cargo clippy --locked --manifest-path crates/irori-ui/Cargo.toml \
            --target wasm32-unknown-unknown --all-targets -- -D warnings
      # The page's own logic (what to show, and which of two states is newer) is plain Rust and
      # runs on the host; the browser is not needed to check it.
      - name: test
        run: cargo test --locked --manifest-path crates/irori-ui/Cargo.toml
      - name: build
        run: cargo xtask ui

      - name: Download stays inside the budget (ROADMAP §4.3)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq brotli
          total=0
          for file in crates/irori/ui/*.wasm crates/irori/ui/*.js crates/irori/ui/*.html; do
            size=$(brotli -q 11 -c "$file" | wc -c)
            echo "$(basename "$file"): $size bytes brotli"
            total=$((total + size))
          done
          echo "total: $total bytes brotli"
          # The barebones UI must stay under 500 KB compressed on a slow home network. The
          # binary doesn't serve these compressed yet; see crates/irori-ui/README.md.
          [ "$total" -le 512000 ] || { echo "over the 500 KB budget"; exit 1; }

      # The binaries built below embed this, so a release carries the real UI, not the
      # placeholder page a UI-less `cargo build` leaves behind.
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: crates/irori/ui
          retention-days: 7

  cross:
    name: static build · ${{ matrix.target }}${{ matrix.features == '--no-default-features' && ' · barebones' || '' }}
    runs-on: ubuntu-latest
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ""
            features: ""
          - target: aarch64-unknown-linux-musl
            runner: qemu-aarch64-static
            features: ""
          - target: aarch64-unknown-linux-musl
            runner: qemu-aarch64-static
            features: --no-default-features
    steps:
      - uses: actions/checkout@v5
        with:
          # Build scripts and tests from the PR run in this job; don't leave a token on disk.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}${{ matrix.features }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # Embedded by the build below (the `ui` feature); ignored by the barebones build.
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: crates/irori/ui
      - name: Install QEMU user-mode emulation
        if: matrix.runner != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo zigbuild --locked --release -p irori --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Smoke test (version, serve, health, SIGTERM)
        env:
          RUNNER: ${{ matrix.runner }}
          BIN: target/${{ matrix.target }}/release/irori
        run: |
          set -euo pipefail
          file "$BIN"
          $RUNNER "$BIN" version --json

          data="$(mktemp -d)"
          config="$(mktemp -d)"
          $RUNNER "$BIN" serve --data "$data" --config "$config" --bind 127.0.0.1:8480 &
          pid=$!
          dev/smoke-test.sh http://127.0.0.1:8480 30
          kill -TERM "$pid"
          wait "$pid"
          test -f "$data/irori.db"
          # The smoke test made and removed a room, so the config dir must exist and hold the
          # files the spec describes (docs/specs/config.md).
          test -f "$config/areas.toml" && test -f "$config/devices.toml"

      - name: Binary size summary
        run: |
          size=$(stat -c %s target/${{ matrix.target }}/release/irori)
          echo "| ${{ matrix.target }} ${{ matrix.features }} | $(numfmt --to=iec-i --suffix=B $size) ($size bytes) |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: irori-${{ matrix.target }}${{ matrix.features == '--no-default-features' && '-barebones' || '' }}
          path: target/${{ matrix.target }}/release/irori
          if-no-files-found: error
          retention-days: 14
