[workspace]
resolver = "3"
members = [
    "crates/irori-types",
    "crates/irori-core",
    "crates/irori-protocol",
    "crates/irori-rules",
    "crates/irori-recorder",
    "crates/irori-config",
    "crates/irori-api",
    "crates/irori-client",
    "crates/irori-helpers",
    "crates/irori-ha-discovery",
    "crates/irori",
    "extensions/demo",
    "extensions/protocols/esphome",
    "extensions/protocols/mqtt",
    "extras/irori-assist",
    "xtask",
]
default-members = ["crates/irori"]
# The UI is a wasm crate with its own dependency tree, built with `trunk` (`cargo xtask ui`),
# not by workspace commands. Keeping it out means a plain `cargo build` needs no wasm toolchain.
exclude = ["crates/irori-ui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
# Not published to crates.io (ROADMAP D7); releases are binaries plus extensions.
publish = false
repository = "https://github.com/nicosandller/irori_os"

[workspace.dependencies]
# Internal crates
irori-types = { path = "crates/irori-types" }
irori-core = { path = "crates/irori-core" }
irori-protocol = { path = "crates/irori-protocol" }
irori-rules = { path = "crates/irori-rules" }
irori-recorder = { path = "crates/irori-recorder" }
irori-config = { path = "crates/irori-config" }
irori-api = { path = "crates/irori-api" }
irori-client = { path = "crates/irori-client" }
irori-helpers = { path = "crates/irori-helpers" }
irori-ha-discovery = { path = "crates/irori-ha-discovery" }
irori-protocol-mqtt = { path = "extensions/protocols/mqtt" }
irori-protocol-demo = { path = "extensions/demo" }
irori-protocol-esphome = { path = "extensions/protocols/esphome" }
irori-assist = { path = "extras/irori-assist" }

# External crates
anyhow = "1.0.104"
# Only to check an ESPHome encryption key is well-formed before handing it to `esphome-client`,
# which already depends on this version.
base64 = "0.22.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# The ESPHome native API: mDNS discovery, the protobuf protocol, and its Noise transport.
# Pinned to one API version on purpose (the crate generates one per ESPHome release).
esphome-client = { version = "0.2.1", features = ["discovery", "api-1-15"] }
http-body-util = "0.1.5"
getrandom = "0.4.3"
# The MQTT client: broker connection, TLS, and the wire protocol. `mqtt` and `zigbee` (its own
# embedded broker's client side) both depend on it directly; xtask/src/deps.rs keeps it out of
# every crate that isn't a protocol.
rumqttc = "0.25.1"
jiff = { version = "0.2.37", default-features = false, features = ["std", "serde"] }
jsonschema = { version = "0.56.0", default-features = false }
mime_guess = { version = "2.0.5", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
schemars = { version = "1.2.2", features = ["jiff02"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Only for tests: the device side of ESPHome's Noise handshake, in the fake ESPHome device.
# The same version `esphome-client` uses for the client side.
snow = "0.10.0"
# The machine behind the instance, for the System menu in Settings: host, OS, CPU, memory, disk.
# Nothing of the `user`/`network`/`component` extras is needed, so they're left out.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
# Safe access to `statvfs`, so the System menu can tell filesystems apart by their id rather
# than by mount-path prefixes (macOS's `/Users` firmlink lives on `/System/Volumes/Data`).
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "use-libc"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util", "io-std"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }
tempfile = "3.27.0"
toml = "1.1.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
# Size and speed both matter (ROADMAP §4.3). Keep unwinding: the protocol host
# relies on catching panics to isolate a crashing protocol (M1.1).
lto = "fat"
codegen-units = 1
strip = true
