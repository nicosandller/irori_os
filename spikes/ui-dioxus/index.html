<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Irori devices (spike)</title>
    <style>
      :root { --ink: #1c1714; --paper: #faf7f4; --ember: #c4552b; --muted: #9a8f86; }
      body { margin: 0; padding: 1.5rem; background: var(--paper); color: var(--ink);
             font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
      h1 { font-size: 1.25rem; margin: 0 0 1rem; }
      input { font: inherit; padding: .4rem .6rem; border: 1px solid var(--muted); border-radius: .4rem; }
      ul { list-style: none; padding: 0; }
      li { display: flex; gap: .75rem; padding: .5rem 0; border-bottom: 1px solid #e8e1da; }
      .id { font-family: ui-monospace, monospace; color: var(--ember); }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <!-- Dioxus mounts here (it looks for #main, then falls back to the body). -->
    <div id="main"></div>
  </body>
</html>
