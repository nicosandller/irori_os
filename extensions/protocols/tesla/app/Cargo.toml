[package]
name = "irori-tesla-app"
description = "The Tesla usage page: what the Fleet API cost this month, where it went, and how often Irori reads."
version = "0.0.0"
edition = "2024"
publish = false
repository = "https://github.com/nicosandller/irori_os"
license = "Apache-2.0"

# Not a workspace member: like the Automations page, it builds for wasm32 with `trunk`
# (`cargo xtask ui` builds every extension's page), and ships in the extension's package as
# `app/`. The empty table says so to cargo, which otherwise takes it for part of the
# extension's crate around it.
[workspace]

[dependencies]
irori-ui-kit = { path = "../../../../crates/irori-ui-kit" }

console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.3.0", features = ["futures"] }
js-sys = "=0.3.105"
leptos = { version = "0.8.20", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Exactly the shell UI's version: the build uses one `wasm-bindgen` CLI for every page.
wasm-bindgen = "=0.2.128"
web-sys = { version = "=0.3.105", features = ["Window", "Document", "Element", "HtmlElement"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
