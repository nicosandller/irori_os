[package]
name = "irori-protocol-homeassistant"
description = "A Home Assistant's devices, areas and floors in Irori, while Home Assistant keeps running them."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# The fake Home Assistant (`src/fake.rs`): for this crate's tests and the load gate's
# `examples/fake_ha.rs` (`dev/ha-load`). Never in the shipped binary.
fake = []

[dependencies]
irori-types.workspace = true
irori-protocol.workspace = true
irori-cloud.workspace = true

# Home Assistant gzips its HLS playlists whatever the request asks (`http.rs`). The irori binary
# already links it.
flate2.workspace = true
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util"] }
# The same version the `irori` binary already links for `irori watch`, so this adds nothing to the
# lockfile. TLS is set up in `transport.rs`, which hands it an open connection. Kept off the
# workspace's `tokio-tungstenite` (Matter's) on purpose.
tokio-tungstenite = "0.26"
# For `https://` addresses (`transport.rs`). All already in the lockfile, at the versions and
# features the ONVIF and Cast extensions use; on this crate only, never on the `irori` binary's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
sha2.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen = "0.13"

[[bin]]
name = "irori-ext-homeassistant"
path = "src/main.rs"

[[example]]
name = "fake_ha"
required-features = ["fake"]

[lints]
workspace = true
