[extension]
id = "mqtt"
name = "MQTT"
version = "0.3.1"
irori = ">=0.0.0"
description = "Devices from an MQTT broker you already run, through Home Assistant MQTT Discovery: Tasmota, Zigbee2MQTT, ESPHome."
config_schema = "config.schema.json"

[[contributes.protocol]]
iot_class = "local_push"
entity_kinds = ["light", "switch", "sensor", "binary_sensor"]
run = { command = "bin/irori-ext-mqtt" }

# The broker itself is usually on the local network (a Zigbee2MQTT/Mosquitto instance, most
# often); a broker reached by hostname over the internet isn't distinguishable from one in this
# check yet (extensions.md's `lan` vs `network` split assumes a protocol knows in advance, which
# a user-entered broker address doesn't fit any better than ESPHome's own `lan = true` does).
[permissions]
lan = true
