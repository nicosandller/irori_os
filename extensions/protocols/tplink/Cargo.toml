[package]
name = "irori-protocol-tplink"
description = "TP-Link Tapo and Kasa plugs and power strips on the local network."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
irori-types.workspace = true
irori-protocol.workspace = true

# KLAP, the plugs' local transport: AES-128-CBC keyed from SHA-256 hashes of the account's
# SHA-1 hashed email and password. All three are already in the tree.
aes = "0.8.4"
base64.workspace = true
getrandom.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10.7"
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "irori-ext-tplink"
path = "src/main.rs"

[lints]
workspace = true
