[extension]
id = "switchbot"
name = "SwitchBot"
version = "0.1.0"
irori = ">=1.5.0"
# 1.5.0 is the first core that draws a protocol's network map and lists what a protocol found
# but can't use.
description = "SwitchBot meters, sensors, locks, plugs, curtains, humidifiers and vacuums, through SwitchBot's cloud."
config_schema = "config.schema.json"
icon = "icon.svg"

# Readings and commands go through SwitchBot's servers, which also reach the devices behind a
# hub. The token and secret key stay on this machine.
[[contributes.protocol]]
iot_class = "cloud_polling"
entity_kinds = ["sensor", "binary_sensor", "lock", "switch", "button", "cover", "humidifier", "vacuum"]
run = { command = "bin/irori-ext-switchbot" }

[permissions]
network = ["api.switch-bot.com"]
