[package]
name = "irori-protocol-bambu"
description = "Bambu Lab printers on the local network, over the printer's own MQTT."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
irori-types.workspace = true
irori-protocol.workspace = true

rumqttc.workspace = true
# The printer's certificate is its own, not one a public authority issued for its address, so
# the connection is built here: the handshake's signature is checked, and the certificate is
# compared with the one remembered or typed in (`link.rs`). The same rustls `rumqttc` uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The certificate's fingerprint.
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The fake printer in the tests: a certificate of its own, served over TLS.
bytes.workspace = true
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "irori-ext-bambu"
path = "src/main.rs"

[lints]
workspace = true
