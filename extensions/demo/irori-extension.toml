[extension]
id = "demo"
name = "Demo"
version = "0.3.1"
irori = ">=0.0.0"
description = "Virtual devices for trying Irori without hardware, going through a whole day every minute: a lamp, a plug that measures power, a hallway light, presence, illuminance and mmWave sensors, an air monitor, door and window contacts, and a TV."
icon = "icon.svg"

[[contributes.protocol]]
iot_class = "local_push"
entity_kinds = ["light", "switch", "sensor", "binary_sensor"]
run = { command = "bin/irori-ext-demo" }
