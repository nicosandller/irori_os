[extension]
id = "demo"
name = "Demo"
version = "0.3.1"
irori = ">=0.0.0"
description = "Virtual devices for trying Irori without hardware: a study lamp and plug, a hallway light, motion, illuminance, and an mmWave with occupancy and target distance."
icon = "icon.svg"

[[contributes.integration]]
iot_class = "local_push"
entity_kinds = ["light", "switch", "sensor", "binary_sensor"]
run = { command = "bin/irori-ext-demo" }
