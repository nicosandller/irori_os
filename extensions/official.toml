# Official first-party extensions. Source lives in this repo. None of them are linked into the
# irori binary: Install copies a package into the instance (from this checkout, from packages
# shipped beside the binary, or from a GitHub release of this repo).

[[extension]]
id = "demo"
name = "Demo"
category = "demo"
description = "Virtual devices for trying Irori without hardware, living a whole day every minute: lights, a plug that measures power, presence, light and air sensors, door and window contacts, a TV and its sofa, and around the house a lock, a doorbell, a blind, a ceiling fan, a water shut-off with a leak alarm, a thermostat, a hot water tank and a dehumidifier."
version = "0.5.1"
source = "extensions/demo"
crate = "irori-protocol-demo"
bin = "irori-ext-demo"

[[extension]]
id = "esphome"
name = "ESPHome"
category = "protocol"
description = "Devices running ESPHome firmware, over ESPHome's native API."
version = "0.4.0"
source = "extensions/protocols/esphome"
crate = "irori-protocol-esphome"
bin = "irori-ext-esphome"

[[extension]]
id = "cast"
name = "Google Cast"
category = "protocol"
description = "Google Cast receivers on the local network: Chromecast, speakers, and speaker groups."
version = "0.1.0"
source = "extensions/protocols/cast"
crate = "irori-protocol-cast"
bin = "irori-ext-cast"

[[extension]]
id = "mqtt"
name = "MQTT"
category = "protocol"
description = "Devices from an MQTT broker you already run, through Home Assistant MQTT Discovery: Tasmota, Zigbee2MQTT, ESPHome."
version = "0.4.1"
source = "extensions/protocols/mqtt"
crate = "irori-protocol-mqtt"
bin = "irori-ext-mqtt"

[[extension]]
id = "zigbee"
name = "Zigbee"
category = "protocol"
description = "Zigbee devices through a USB dongle. Brings its own Zigbee2MQTT and broker: the MQTT extension isn't needed."
version = "0.3.1"
source = "extensions/protocols/zigbee"
crate = "irori-protocol-zigbee"
bin = "irori-ext-zigbee"
# `host_shell` in the manifest: it downloads and runs Node.js and Zigbee2MQTT. The page has to
# say "full access to this machine" before Install does anything (extensions.md §7).
full_access = true

[[extension]]
id = "automations"
name = "Automations"
category = "automation"
description = "Build automations as flows on a canvas, test them before trusting them, and see why one didn't run."
version = "0.4.1"
source = "extensions/automations"
crate = "irori-engine-automations"
bin = "irori-ext-automations"

# Helpers aren't listed here: they're core to Irori (crates/irori-helpers), built in and always
# running, not an installable package.
