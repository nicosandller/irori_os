[package]
name = "irori-automations-app"
description = "The Automations page: build flows on a canvas, test them, and see why they ran or didn't."
version = "0.0.0"
edition = "2024"
publish = false
repository = "https://github.com/nicosandller/irori_os"
license = "Apache-2.0"

# Not a workspace member: like the shell's own UI, it builds for wasm32 with `trunk`
# (`cargo xtask ui` builds both), and ships in the extension's package as `app/`. The empty
# table says so to cargo, which otherwise takes it for part of the extension's crate around it.
[workspace]

[dependencies]
irori-types = { path = "../../../crates/irori-types" }
irori-flow-types = { path = "../../../crates/irori-flow-types" }
irori-ui-kit = { path = "../../../crates/irori-ui-kit" }

console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.3.0", features = ["futures"] }
# Already in the bundle through irori-types; here to make and format `Timestamp`s.
jiff = { version = "0.2", default-features = false, features = ["std"] }
js-sys = "=0.3.105"
leptos = { version = "0.8.20", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Exactly the shell UI's version: the build uses one `wasm-bindgen` CLI for both pages
# (the dev container installs that one version), and it must match the crate exactly.
wasm-bindgen = "=0.2.128"
web-sys = { version = "=0.3.105", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomRect",
    "Location",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "HashChangeEvent",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
