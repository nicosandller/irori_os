[extension]
id = "automations"
name = "Automations"
version = "0.4.1"
irori = ">=0.7.0"
# 0.7.0 reads entity categories, text sensor options, the unmodeled list and entity formats.
description = "Build automations as flows on a canvas, watch them run, and see why one didn't."
icon = "icon.svg"
# Format 16 is the one that adds media players. A player's value is its playback
# (`off`, `idle`, `playing`, `paused`, `buffering`, `standby`), so a state trigger's
# `to` and a condition's `is` name that word. This format also includes every kind
# added before media players; the engine reads those by the same primary value.
entity_format = 16

[[contributes.automation]]
run = { command = "bin/irori-ext-automations" }

[[contributes.app]]
label = "Automations"
entry = "app/index.html"

# It watches the home (registry, states, changes, the last day of history) and acts on it
# (service calls). Its flows live in the config directory, beside irori.toml, so they're plain
# files you can put in git.
[permissions]
api = ["registry:read", "states:read", "events:read", "services:call", "history:read"]
host_fs = ["$CONFIG/flows"]
