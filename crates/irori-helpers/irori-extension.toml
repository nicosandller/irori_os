[extension]
id = "helpers"
name = "Helpers"
version = "0.4.0"
irori = ">=0.0.0"
description = "Values Irori keeps itself rather than a device reporting them, for flows to use and people to set: toggles, numbers, counters, choices, texts, buttons, dates and times, timers, schedules, and values worked out from other entities."
icon = "icon.svg"

# Nothing leaves this machine: the values live in Irori's own database. Built in, not an
# installable extension — there is no `run`, and it isn't listed in extensions/official.toml.
[[contributes.protocol]]
iot_class = "local_push"
entity_kinds = ["switch", "number", "select", "text", "button", "event", "date", "time", "datetime", "timer", "schedule", "light", "fan", "cover", "binary_sensor", "sensor"]

# Schedules keep to the home's clock, and helpers that work out a value from other entities
# read them, their history, and call them (a group). All of it stays on this machine.
[permissions]
api = ["registry:read", "states:read", "history:read", "services:call"]
