[package]
name = "irori"
description = "The Irori binary: server, CLI, and embedded UI."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Barebones default build (ROADMAP D17). Official extensions are packages, not cargo features.
# `--no-default-features` must still build, start, and serve the API.
default = ["ui", "assist"]
ui = ["dep:rust-embed", "dep:mime_guess"]
# The assistant control plane: settings, chat, and provider clients. Weights and Ollama stay
# downloaded, not compiled in. `--no-default-features` still builds without it.
assist = [
    "dep:irori-assist",
    "dep:reqwest",
    "dep:tokio-stream",
    "dep:futures-util",
]

[dependencies]
irori-config.workspace = true
irori-core.workspace = true
irori-helpers.workspace = true
irori-protocol.workspace = true
irori-types.workspace = true
irori-assist = { workspace = true, optional = true }
futures-util = { version = "0.3.32", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
tokio-stream = { version = "0.1.17", features = ["sync"], optional = true }
# The checksum of the Ollama release Irori downloads on request (ollama.rs).

anyhow.workspace = true
# Passwords (`server/auth.rs`): argon2id hashes, and the SHA-256 a session's token is kept as.
argon2 = "0.5.3"
sha2.workspace = true
# Serving over https (`tls.rs`): the handshake, reading a certificate, and making one for a home
# that has none. `ring` and not the default provider, which needs a C toolchain to cross-build.
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2.2.0"
rcgen = { version = "0.13.2", default-features = false, features = ["crypto", "pem", "ring"] }
# Checking that a time zone is one Irori can tell the time in, on an image with no zoneinfo.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
mime_guess = { workspace = true, optional = true }
rusqlite.workspace = true
rust-embed = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo.workspace = true

[target.'cfg(unix)'.dependencies]
# Filesystem ids via `statvfs`, for picking the volume the data directory is on (host_info.rs).
rustix.workspace = true

[dev-dependencies]
http-body-util.workspace = true
irori-protocol-demo.workspace = true
schemars.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
