[package]
name = "irori"
description = "The Irori binary: server, CLI, and embedded UI."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Barebones default build (ROADMAP D17). Official extensions are packages, not cargo features.
# `--no-default-features` must still build, start, and serve the API.
default = ["ui"]
ui = ["dep:rust-embed", "dep:mime_guess"]
# Opt-in, never in the default build (ROADMAP D13).
assist = ["dep:irori-assist"]

[dependencies]
irori-config.workspace = true
irori-core.workspace = true
irori-integration.workspace = true
irori-types.workspace = true
irori-assist = { workspace = true, optional = true }

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
mime_guess = { workspace = true, optional = true }
rusqlite.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo.workspace = true

[dev-dependencies]
http-body-util.workspace = true
irori-int-demo.workspace = true
irori-int-helpers.workspace = true
schemars.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
