[package]
name = "irori"
description = "The Irori binary: server, CLI, and embedded UI."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Barebones default build (ROADMAP D17). `--no-default-features` must still build, start, and serve the API.
default = ["int-mqtt", "int-demo", "int-esphome", "ui"]
int-mqtt = ["dep:irori-int-mqtt"]
int-demo = ["dep:irori-int-demo"]
int-esphome = ["dep:irori-int-esphome"]
ui = ["dep:rust-embed", "dep:mime_guess"]
# Opt-in, never in the default build (ROADMAP D13).
assist = ["dep:irori-assist"]

[dependencies]
irori-core.workspace = true
irori-integration.workspace = true
irori-types.workspace = true
irori-int-mqtt = { workspace = true, optional = true }
irori-int-demo = { workspace = true, optional = true }
irori-int-esphome = { workspace = true, optional = true }
irori-assist = { workspace = true, optional = true }

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
mime_guess = { workspace = true, optional = true }
rusqlite.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
