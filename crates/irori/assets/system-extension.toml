[extension]
id = "irori"
name = "Irori"
version = "0.4.0"
irori = ">=0.0.0"
description = "Irori itself as a device: its version, how long it's been up, how busy the machine is, and updates to its extensions, for automations to use."

# Built in and always running: it reads this machine, nothing else, and isn't installable.
[[contributes.protocol]]
iot_class = "local_polling"
entity_kinds = ["sensor", "update"]
