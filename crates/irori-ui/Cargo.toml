[package]
name = "irori-ui"
description = "The web UI: a Leptos app compiled to wasm and embedded in the binary."
version = "0.0.0"
edition = "2024"
publish = false
repository = "https://github.com/nicosandller/irori_os"
license = "Apache-2.0"

# Not a workspace member: this builds for wasm32 with `trunk`, not with the workspace's
# `cargo build`. `cargo xtask ui` builds it; CI checks it compiles (see .github/workflows/ci.yml).

[dependencies]
irori-types = { path = "../irori-types" }
# The bridge to extensions' own pages (app_frame.rs).
irori-ui-kit = { path = "../irori-ui-kit" }

console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json", "websocket"] }
# `StreamExt` for the live socket. Already in the bundle through gloo-net; named here so this
# crate can use it.
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = { version = "0.8.15", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# Already in the bundle transitively (irori-types uses it); this is only so this crate's own
# code can `use` it directly — no size cost of its own.
serde_json = "1.0.151"
# Remembering which way the device list was last shown, dragging devices into areas, and —
# for the Floorplan — measuring the canvas, which is what turns a pointer into a place on the
# plan.
web-sys = { version = "0.3", features = [
    "Storage",
    "DragEvent",
    "DataTransfer",
    "DomRect",
    "Element",
    "WheelEvent",
    # The copy button: `navigator.clipboard` (log_window.rs). `Window` is what `web_sys::window`
    # comes back as, and `Clipboard` is what its `navigator` hands back.
    "Window",
    "Location",
    "Navigator",
    "Clipboard",
    # Numbers that count to their new value (count.rs): finding them, and asking whether the
    # system wants less motion.
    "NodeList",
    "MediaQueryList",
    # Extensions' pages (app_frame.rs): the frame, its messages, the address bar, and the
    # shell's tokens as they compute.
    "HtmlIFrameElement",
    "MessageEvent",
    "History",
    "CssStyleDeclaration",
    # An answer read as it is written (api.rs), and the chat keeping its newest line in view.
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "HtmlElement",
    "KeyboardEvent",
    # The map (map.rs): a pin dragged, and the map zoomed with the wheel.
    "PointerEvent",
    # A picture of a floorplan handed to the assistant (assistant.rs): the file chosen, and
    # what is in it.
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
] }
# Already in the bundle transitively (leptos uses it); this is only so the copy button can await
# the promise the clipboard API returns — no size cost of its own.
wasm-bindgen-futures = "0.4.78"

[profile.release]
# Download size is the budget that matters here (ROADMAP §4.3).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
