                                     border-color var(--dur-base), opacity var(--dur-base); }
    .floorplan .marker.switchable:hover, .floorplan .marker.movable:hover { scale: 1.06; }
    .floorplan .marker.switchable:active, .floorplan .marker.movable:active { scale: .96; }
    .floorplan .marker .pip { position: relative;
                              transition: background-color var(--dur-base) var(--ease-out),
                                          box-shadow var(--dur-base) var(--ease-out); }
    .floorplan .marker.on .pip::after { content: ""; position: absolute; inset: 0;
                                        border-radius: 50%; pointer-events: none;
                                        animation: ring .6s var(--ease-out) forwards; }
    @keyframes ring {
        from { box-shadow: 0 0 0 0 rgba(196, 85, 43, .55); }
        to { box-shadow: 0 0 0 .7rem rgba(196, 85, 43, 0); }
    }

    /* Held, a marker lifts off the plan; put down, it settles with a bounce. A motion sensor
       that senses someone lights its pip. */
    .floorplan .marker.lifted { scale: 1.12;
                                box-shadow: 0 .6rem 1.2rem rgba(28, 23, 20, .22); }
    .floorplan .marker.dropped { animation: settle-down 520ms var(--ease-bounce); }
    @keyframes settle-down { from { scale: 1.14; } }
    .floorplan .marker.sensing .pip { background: var(--ember);
                                      box-shadow: 0 0 .5rem var(--ember); }

    /* The plan, alive (floorplan/ambience.rs): a lit light's warm pool, as bright as the light
       and stopped by its room's walls, fading as the light changes; a motion sensor's ripples
       spreading across its room while it senses someone. With motion off the ripples stand
       still as a faint ring — still saying someone's there. */
    .floorplan .pool { transition: opacity var(--dur-expressive) var(--ease-out); }
    .floorplan .ripple circle { fill: none; stroke: var(--ember); stroke-width: 2;
                                vector-effect: non-scaling-stroke; opacity: .3; scale: .6;
                                transform-box: fill-box; transform-origin: center;
                                animation: ripple 1.8s var(--ease-out) infinite; }
    .floorplan .ripple .later { animation-delay: .9s; }
    @keyframes ripple { from { scale: .08; opacity: .6; } to { scale: 1; opacity: 0; } }
    @media (prefers-color-scheme: dark) {
      .floorplan .pool { mix-blend-mode: screen; }
    }

    /* Changing floor (transition.rs `around`): the plan, and only the plan, moves — going up,
       the floor below sinks away and the one above comes down into view. */
    .floorplan .canvas { view-transition-name: plan; }
    html[data-nav][data-nav^="floor"]::view-transition-old(page),
    html[data-nav][data-nav^="floor"]::view-transition-new(page),
    html[data-nav][data-nav^="floor"]::view-transition-group(plan) { animation: none; }
    html[data-nav][data-nav^="floor"]::view-transition-old(plan) {
        animation: page-away var(--dur-base) var(--ease-out) both; }
    html[data-nav][data-nav^="floor"]::view-transition-new(plan) {
        animation: page-arrive var(--dur-expressive) var(--ease-emphasized) both; }
    html[data-nav="floor-up"] { --away: 0 56px; --from: 0 -56px; }
    /* Changing page onto or off the Floorplan, the plan is part of the page, and moves with it. */
    html[data-nav]:not([data-nav^="floor"])::view-transition-group(plan) { animation: none; }
    html[data-nav]:not([data-nav^="floor"])::view-transition-old(plan) {
        animation: page-away var(--dur-fast) var(--ease-out) both; }
    html[data-nav]:not([data-nav^="floor"])::view-transition-new(plan) {
        animation: page-arrive var(--dur-expressive) var(--ease-emphasized) both; }
    html[data-nav="floor-down"] { --away: 0 -56px; --from: 0 56px; }

    /* What's picked, and what's being drawn: dashed lines that march, the way a selection does
       in any drawing tool. Walls and openings change colour rather than switching. */
    .floorplan .area.chosen, .floorplan .pending line, .floorplan .tracing polygon {
        animation: march .8s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -10; } }
    .floorplan .wall, .floorplan .door, .floorplan .window {
        transition: stroke var(--dur-fast) var(--ease-out); }

    /* On a phone the tools take the width rather than a column down the side of a small canvas. */
    @media (max-width: 720px) {
      .floorplan .toolbar { top: auto; bottom: 4.5rem; left: 1rem; right: 1rem;
                            flex-direction: row; justify-content: center; }
      .floorplan .tool-gap { width: 1px; height: auto; margin: .3rem .2rem; }
      .floorplan .toolbar > .glide { display: none; }
      .floorplan .device-picker { top: 4rem; left: 1rem; right: 1rem; width: auto; }
      .floorplan .inspector { width: auto; }
      .floorplan .plan-side { top: 4rem; right: 1rem; max-height: 45%; }
      .floorplan .floor-picker { min-width: 0; }
      .floorplan .plan-foot { align-items: flex-start; }
    }

    /* A window over the page, for a job with its own Save and Cancel: an extension's settings,
       or adding a device. Both used to open in place and push the page around them down. */
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center;
                      justify-content: center; padding: 1.5rem 1rem;
                      background: rgba(28, 23, 20, .45); }
    .modal { width: 100%; max-width: 34rem; max-height: 100%; display: flex;
             flex-direction: column; background: var(--card); border: 1px solid var(--line);
             border-radius: .6rem; box-shadow: 0 1.5rem 3rem rgba(28, 23, 20, .25); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
                  padding: .9rem 1.25rem; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 1.05rem; }
    .modal-close { width: 2rem; height: 2rem; padding: 0; font: inherit; font-size: 1.3rem;
                   line-height: 1; color: var(--muted); background: transparent;
                   border: 1px solid transparent; border-radius: .4rem; cursor: pointer; }
    .modal-close:hover { color: var(--ember); border-color: var(--line); }
    .modal-body { padding: 1rem 1.25rem 1.25rem; overflow-y: auto; }
    /* A window arrives: the page dims behind it and the window rises into place. Once per
       opening — a window is fixed markup around whatever redraws inside it. */
    .modal-backdrop { animation: dim var(--dur-base) var(--ease-out) backwards; }
    .modal { animation: rise-in var(--dur-layout) var(--ease-emphasized) backwards; }
    @keyframes dim { from { background: rgba(28, 23, 20, 0); } }
    @keyframes rise-in { from { opacity: 0; translate: 0 .75rem; scale: .98; } }

    /* Asking before something that can't be taken back. */
    .confirm p { margin: 0 0 .6rem; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; }
    .confirm-actions button { padding: .45rem .9rem; font: inherit; font-size: .9rem;
                              color: var(--fg); background: var(--card);
                              border: 1px solid var(--line); border-radius: .4rem; cursor: pointer; }
    .confirm-actions button:hover { border-color: var(--muted); }
    .confirm-actions .danger-solid { color: #fff; background: #b4342c; border-color: #b4342c; }
    .confirm-actions .danger-solid:hover { background: #982b24; border-color: #982b24; }
    /* In a window of its own, the form needs no rule dividing it off from a card above it. */
    .modal .settings-form { margin-top: 0; padding-top: 0; border-top: none; }
    .modal .add-device { margin: 0; }

    /* What a setting is for, in the words its own extension used to describe it. A line under
       the field rather than a `title=` tooltip, which a phone can't show at all. */
    .settings-help { color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .settings-required { margin-left: .4rem; color: var(--ember); font: .65rem var(--mono);
                         letter-spacing: .08em; text-transform: uppercase; }
    .settings-field select { padding: .4rem .6rem; font: inherit; font-size: .95rem;
                             color: var(--fg); background: var(--bg);
                             border: 1px solid var(--line); border-radius: .4rem; }
    .settings-field select:focus { outline: 2px solid var(--ember); outline-offset: -1px; }
    .settings-advanced { border: 1px solid var(--line); border-radius: .4rem;
                         padding: .5rem .75rem; }
    .settings-advanced summary { cursor: pointer; font-size: .85rem; color: var(--muted); }
    .settings-advanced[open] summary { margin-bottom: .5rem; color: var(--fg); }
    .settings-advanced .settings-field { margin-top: .6rem; }

    /* Not a failure: it's waiting on a person, and the way out is the button beside it. */
    .state.wants-setup { color: var(--ember); }
    .ext-settings-btn.wants-setup { width: auto; padding: 0 .7rem; font-size: .85rem;
                                    color: var(--ember); border-color: var(--ember); }

    /* Step one of adding a device: the extensions as things to press, not a list that expands.
       They come in one after another when the window opens. */
    .protocol-cards { display: grid; gap: .6rem; margin-top: .8rem;
                      grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); }
    .protocol-card { display: flex; flex-direction: column; align-items: flex-start; gap: .3rem;
                     padding: .8rem; font: inherit; text-align: left; color: inherit;
                     background: var(--card); border: 1px solid var(--line); border-radius: .5rem;
                     cursor: pointer;
                     animation: rise var(--dur-base) var(--ease-out) backwards;
                     animation-delay: calc(var(--i, 0) * 45ms); }
    .protocol-card:hover { border-color: var(--ember); translate: 0 -2px;
                           box-shadow: 0 .4rem 1rem rgba(28, 23, 20, .08); }
    .protocol-card .protocol-icon { width: 1.75rem; height: 1.75rem; margin-bottom: .2rem; }
    .protocol-card .name { font-weight: 500; }
    .protocol-card-counts { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    /* A secondary action in the window: a small bordered button, not a word to find. */
    .quiet-button { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .65rem;
                    font: inherit; font-size: .82rem; color: var(--muted); text-decoration: none;
                    background: var(--card); border: 1px solid var(--line); border-radius: .4rem;
                    cursor: pointer; white-space: nowrap; }
    .quiet-button:hover { color: var(--ember); border-color: var(--ember); }
    .quiet-button svg { width: .9rem; height: .9rem; }
    .protocol-back { margin: 0 0 .75rem; }
    .add-intro { display: flex; align-items: flex-start; gap: 1rem; }
    .add-intro p { margin: 0; flex: 1; }

    /* A number of things found: a small ember pill, the one colour on the page that says
       "something here for you". On the Devices page it sits on the Add device button. */
    .found-count, .count-badge { display: inline-grid; place-items: center; min-width: 1.25rem;
                   height: 1.25rem; padding: 0 .35rem; font: 500 .7rem/1 var(--mono);
                   color: #fff; background: var(--ember); border-radius: 1rem; }
    .found-count.quiet { color: var(--muted); background: var(--sunk); }
    h4 .found-count { margin-left: .45rem; vertical-align: .1em; }
    .add .count-badge { margin-left: .45rem; vertical-align: .05em;
                        animation: pop var(--dur-expressive) var(--ease-bounce) backwards; }
    @keyframes pop { from { scale: 0; } }

    /* Step two: one extension. Its heading is the card that was picked, grown. */
    .add-step-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem;
                     view-transition-name: add-hero; }
    .add-step-head h3 { margin: 0; font-size: 1.05rem; }
    .add-step-head .protocol-icon { width: 1.75rem; height: 1.75rem; }
    .add-step { view-transition-name: add-step; }
    .found, .in-home { margin-top: 1rem; }
    .found-head { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem;
                  margin-bottom: .5rem; }
    .found h4, .in-home h4 { margin: 0; font-size: .7rem; font-family: var(--mono);
                             font-weight: 400; letter-spacing: .08em; text-transform: uppercase;
                             color: var(--muted); }
    .in-home h4 { margin-bottom: .5rem; }
    .found-actions { margin-left: auto; display: flex; gap: .5rem; }
    button.primary { padding: .4rem .85rem; font: inherit; font-size: .85rem; font-weight: 500;
                     color: #fff; background: var(--ember); border: 1px solid var(--ember);
                     border-radius: .4rem; cursor: pointer;
                     animation: rise var(--dur-fast) var(--ease-out) backwards; }
    button.primary:hover { background: #ab4717; border-color: #ab4717; }

    /* A device, as a card: what it is and what it would bring, and one button to bring it in. */
    .device-cards { display: grid; gap: .4rem; margin: 0; padding: 0; list-style: none; }
    .device-card { display: grid; grid-template-rows: 1fr;
                   animation: rise var(--dur-base) var(--ease-out) backwards;
                   animation-delay: calc(min(var(--i, 0), 8) * 40ms);
                   transition: grid-template-rows var(--dur-layout) var(--ease-emphasized),
                               opacity var(--dur-layout), margin var(--dur-layout); }
    .device-card-inner { display: flex; align-items: center; gap: .7rem; min-height: 0;
                         overflow: hidden; padding: .6rem .75rem; color: inherit;
                         text-decoration: none; background: var(--card);
                         border: 1px solid var(--line); border-radius: .5rem;
                         transition: border-color var(--dur-fast), box-shadow var(--dur-base),
                                     background-color var(--dur-fast); }
    .device-card .protocol-icon { flex: none; width: 1.6rem; height: 1.6rem; }
    .device-card-text { display: flex; flex-direction: column; gap: .15rem; min-width: 0;
                        flex: 1; }
    .device-card .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-card-made { color: var(--muted); font-size: .78rem; }
    .provides { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .1rem; }
    .chip { padding: .05rem .4rem; font: .65rem/1.5 var(--mono); color: var(--muted);
            background: var(--sunk); border-radius: .25rem; }
    .chip.quiet { font-style: italic; }
    .found-card.picked .device-card-inner { border-color: var(--ember);
        background: color-mix(in srgb, var(--ember) 5%, var(--card)); }
    .found-card .device-card-inner:hover { border-color: var(--muted); }
    /* One that turned up while the window was open says so, once. */
    .device-card.arrived { animation: arrive var(--dur-expressive) var(--ease-out) backwards; }
    .device-card.arrived .device-card-inner { animation: glow 1.6s var(--ease-out); }
    @keyframes arrive { from { opacity: 0; translate: 0 -6px; scale: .98; } }
    @keyframes glow { from { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 35%, transparent); } }
    /* Added: the check shows, then the card folds away to nothing and the ones below close up. */
    .device-card.leaving { grid-template-rows: 0fr; opacity: 0; margin-bottom: -.4rem;
                           transition-delay: var(--dur-base); pointer-events: none; }

    .add-one { position: relative; flex: none; min-width: 4.2rem; height: 2rem; padding: 0 .8rem;
               font: inherit; font-size: .85rem; font-weight: 500; color: var(--ember);
               background: var(--card); border: 1px solid var(--ember); border-radius: .4rem;
               cursor: pointer; }
    .add-one:hover { color: #fff; background: var(--ember); }
    .add-one-label { transition: opacity var(--dur-fast); }
    .add-one-check { position: absolute; inset: 0; margin: auto; width: 1.1rem; height: 1.1rem;
                     stroke-dasharray: 1; stroke-dashoffset: 1; }
    /* On its way: the word gives way to a turning ring. */
    .add-one.busy .add-one-label, .add-one.done .add-one-label { opacity: 0; }
    .add-one.busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: .9rem;
                           height: .9rem; border: 2px solid currentColor; border-right-color: transparent;
                           border-radius: 50%; animation: turn .7s linear infinite; }
    @keyframes turn { to { rotate: 1turn; } }
    .add-one.done { color: #fff; background: var(--ember); opacity: 1; }
    .add-one.done .add-one-check { stroke-dashoffset: 0;
        transition: stroke-dashoffset var(--dur-expressive) var(--ease-spring); }

    /* Nothing found yet: it's listening, and a ring breathing out from the middle says so. */
    .listening-empty { display: flex; flex-direction: column; align-items: center; gap: .3rem;
                       padding: 1.2rem 1rem; text-align: center; border: 1px dashed var(--line);
                       border-radius: .5rem; }
    .listening-empty p { margin: 0; }
    .listening-ring { position: relative; width: .7rem; height: .7rem; margin-bottom: .4rem;
                      border-radius: 50%; background: var(--ember); }
    .listening-ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
                             border: 2px solid var(--ember);
                             animation: ping 1.8s var(--ease-out) infinite; }
    @keyframes ping { to { scale: 3; opacity: 0; } }

    /* Found but locked: the same card, with its key form inside it and a dashed ember edge that
       says it needs something from you before it can be added. The sentence explaining the whole
       list is the section heading's job here. */
    .found .waiting-for > p { display: none; }
    .found .waiting-list { display: grid; gap: .4rem; margin-bottom: .4rem; }
    .found .waiting-list li { padding: .7rem .8rem; background: var(--card);
                              border: 1px dashed var(--ember); border-radius: .5rem;
                              animation: rise var(--dur-base) var(--ease-out) backwards; }
    .found .waiting-list li:last-child { border-bottom: 1px dashed var(--ember); }

    /* What's already in the home: the same card, pointing to the device's page. */
    .home-card .device-card-inner:hover { border-color: var(--ember); }
    .home-card .home-chevron { flex: none; width: 1rem; height: 1rem; color: var(--muted);
                          transition: translate var(--dur-fast) var(--ease-out), color var(--dur-fast); }
    .home-card .device-card-inner:hover .home-chevron { color: var(--ember); translate: 3px 0; }

    /* Between the two steps (transition.rs `step`): the step being left slides away and the
       next comes in from the side it's going to, while the picked card and the heading become
       each other. The page behind stays still. */
    html[data-nav^="step"]::view-transition-group(root),
    html[data-nav^="step"]::view-transition-group(page) { animation: none; }
    html[data-nav^="step"]::view-transition-old(root),
    html[data-nav^="step"]::view-transition-new(root),
    html[data-nav^="step"]::view-transition-old(page),
    html[data-nav^="step"]::view-transition-new(page) { animation: none; }
    html[data-nav^="step"]::view-transition-group(add-hero) {
        animation-duration: var(--dur-expressive); animation-timing-function: var(--ease-emphasized); }
    html[data-nav="step-in"]::view-transition-old(add-step) {
        animation: step-away-left var(--dur-layout) var(--ease-out) both; }
    html[data-nav="step-in"]::view-transition-new(add-step) {
        animation: step-from-right var(--dur-expressive) var(--ease-emphasized) both; }
    html[data-nav="step-out"]::view-transition-old(add-step) {
        animation: step-away-right var(--dur-layout) var(--ease-out) both; }
    html[data-nav="step-out"]::view-transition-new(add-step) {
        animation: step-from-left var(--dur-expressive) var(--ease-emphasized) both; }
    @keyframes step-away-left { to { opacity: 0; translate: -2rem 0; } }
    @keyframes step-away-right { to { opacity: 0; translate: 2rem 0; } }
    @keyframes step-from-right { from { opacity: 0; translate: 2rem 0; } }
    @keyframes step-from-left { from { opacity: 0; translate: -2rem 0; } }

    /* Step two: what this one extension has found, waiting and already here. */
    .protocol-found { margin-top: 1rem; }
    .protocol-found-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem;
                           margin: 0 0 .4rem; }
    .protocol-found-head h3 { margin: 0; font-size: .9rem; }
    .protocol-found h3 { margin: 0 0 .4rem; font-size: .9rem; }
    .protocol-found p { margin: 0; }

    /* The log window (log_window.rs): a bar of filters, a search and the copy button, then the
       log itself — one row per line, so it reads down the page rather than across it. */
    .modal.wide { max-width: 60rem; }
    .log-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: .6rem 0; }
    .log-filter button { display: inline-flex; align-items: center; gap: .35rem; }
    .log-count { min-width: 1.2rem; padding: 0 .3rem; font: .65rem/1.4 var(--mono);
                 text-align: center; color: var(--card); background: var(--muted);
                 border-radius: 1rem; }
    .log-filter button:nth-child(2) .log-count { background: var(--warn); }
    .log-filter button:nth-child(3) .log-count { background: var(--error); }
    .log-filter button .log-count.none { color: var(--muted); background: transparent; }
    .log-search { flex: 1 1 10rem; min-width: 0; padding: .35rem .6rem; font: inherit;
                  font-size: .85rem; color: var(--fg); background: var(--card);
                  border: 1px solid var(--line); border-radius: .4rem; }
    .log-search:focus { outline: 2px solid var(--ember); outline-offset: -1px; }

    /* Copy: an icon, quiet until it's wanted. The clipboard gives way to a check that draws
       itself in when the copy worked, and gives a little shake when the browser said no. */
    .log-copy { display: inline-grid; place-items: center; width: 2.1rem; height: 2.1rem;
                padding: 0; color: var(--muted); background: var(--card);
                border: 1px solid var(--line); border-radius: .4rem; cursor: pointer; }
    .log-copy:hover { color: var(--fg); border-color: var(--muted); }
    .log-copy .copy-icon { width: 1.1rem; height: 1.1rem; overflow: visible; }
    .log-copy .copy-clip { transform-origin: center; transform-box: fill-box;
                           transition: opacity var(--dur-fast), scale var(--dur-base) var(--ease-out); }
    .log-copy .copy-check { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
                            transition: stroke-dashoffset var(--dur-expressive) var(--ease-spring),
                                        opacity var(--dur-fast); }
    .log-copy.done { color: var(--ember); border-color: var(--ember); }
    .log-copy.done .copy-clip { opacity: 0; scale: .6; }
    .log-copy.done .copy-check { stroke-dashoffset: 0; opacity: 1; }
    .log-copy.failed { color: #b4342c; border-color: #b4342c;
                       animation: shake var(--dur-expressive) var(--ease-out); }
    @keyframes shake { 20%, 60% { translate: -3px 0; } 40%, 80% { translate: 3px 0; } }

    /* The log: scrolls in place, newest at the bottom. */
    .log-window { max-height: min(60vh, 34rem); overflow: auto; background: var(--sunk);
                  border-radius: .4rem; font: .78rem/1.5 var(--mono); }
    .log-quiet { margin: 0; padding: .8rem; font-family: var(--sans); }
    .log-lines { margin: 0; padding: .3rem 0; list-style: none; }
    /* A row: when, how serious, and what — the time and the level in columns of their own, so
       the eye can run down either. A long message wraps under itself rather than off the edge. */
    .log-row { display: grid; grid-template-columns: 4.6rem 3.4rem 1fr; gap: .6rem;
               align-items: baseline; padding: .12rem .75rem .12rem calc(.75rem - 2px);
               border-left: 2px solid transparent; }
    .log-row:hover { background: color-mix(in srgb, var(--line) 45%, transparent); }
    .log-row.log-warn { border-left-color: var(--warn);
                        background: color-mix(in srgb, var(--warn) 7%, transparent); }
    .log-row.log-error { border-left-color: var(--error);
                         background: color-mix(in srgb, var(--error) 9%, transparent); }
    /* A line that arrived while the window was open fades in where it lands. */
    .log-row.fresh { animation: log-in var(--dur-layout) var(--ease-out) backwards; }
    @keyframes log-in { from { opacity: 0; translate: 0 4px; } }
    .log-stamp { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .log-level { justify-self: start; padding: 0 .35rem; font-size: .62rem; line-height: 1.5;
                 letter-spacing: .06em; text-transform: uppercase; border-radius: .25rem; }
    .log-level.error { color: var(--card); background: var(--error); font-weight: 600; }
    .log-level.warn { color: var(--warn); border: 1px solid var(--warn); }
    .log-level.info { color: var(--muted); border: 1px solid var(--line); }
    .log-level.debug, .log-level.trace { color: var(--muted); opacity: .7; }
    .log-text { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
    .log-row.log-error .log-message { color: var(--error); font-weight: 600; }
    .log-source { display: inline-block; margin-right: .45rem; padding: 0 .35rem;
                  font-size: .68rem; color: var(--fg); background: var(--card);
                  border: 1px solid var(--line); border-radius: .25rem; }
    .log-field { margin-left: .6rem; color: var(--muted); }
    .log-key { opacity: .75; }
    @media (max-width: 40rem) {
      .log-row { grid-template-columns: auto 1fr; }
      .log-row .log-text { grid-column: 1 / -1; }
    }

    /* While a pairing window is open: what to do now, and what has arrived so far. */
    .listening { margin-top: .6rem; padding: .6rem .75rem; background: var(--sunk);
                 border-radius: .4rem; }
    .listening p { margin: 0; font-size: .85rem; }
    .listening p + p { margin-top: .35rem; }

    @media (max-width: 40rem) {
      .modal-backdrop { padding: 0; align-items: flex-end; }
      .modal { max-width: none; height: 100%; border-radius: 0; border: none; }
    }
  </style>
</head>
