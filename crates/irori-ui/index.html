    .volume-mount { display: flex; align-items: center; gap: .4rem; overflow-wrap: anywhere; }
    .volume-words { color: var(--muted); }
    .using { display: grid; gap: .4rem; }
    .using-title { margin: 0; color: var(--muted); font: .7rem var(--mono); letter-spacing: .08em;
                   text-transform: uppercase; font-weight: 400; }
    .using p { margin: 0; }
    .using .volumes li { grid-template-columns: minmax(6rem, 1.2fr) minmax(4rem, 1fr) 4.5rem; }
    .using .volume-words { text-align: right; }
    @media (max-width: 720px) {
      .settings-table > .fold-row > .drawer > .drawer-inner > * { margin-left: 1rem; }
      .meter-head { grid-template-columns: 1.15rem 1fr max-content auto; }
      .meter-head .meter-bar { grid-row: 2; grid-column: 1 / -1; }
      .meter-words { display: none; }
      .meter-more { padding-left: .8rem; }
    }

    /* Floors and areas (places.rs): a floor folds, its areas are rows, an area's devices are
       chips. A chip is dragged onto an area and an area, by its grip, onto a floor; only what
       is under the pointer lights up, and what was dropped travels to where it landed. */
    .places { display: grid; gap: .6rem; }
    .places-note { margin: 0; }
    .floor { border: 1px solid var(--line); border-radius: .5rem; overflow: hidden;
             transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
    .floor .fold-row { border-bottom: none; }
    .floor .fold-head { background: var(--sunk); }
    .floor .fold-toggle:hover { background: var(--line); }
    .places.dragging-area .floor { border-style: dashed; }
    .floor.over { border-style: solid; border-color: var(--ember);
                  box-shadow: 0 0 0 2px color-mix(in srgb, var(--ember) 30%, transparent); }
    .places .area { padding: .55rem .8rem .65rem; border-top: 1px solid var(--line);
            transition: background-color var(--dur-fast), box-shadow var(--dur-fast),
                        opacity var(--dur-fast); }
    .places.dragging-device .area, .places.dragging-device .unassigned .chips {
        outline: 1px dashed var(--line); outline-offset: -3px; }
    .area.over, .unassigned .chips.over {
        background: color-mix(in srgb, var(--ember) 10%, transparent);
        box-shadow: inset 2px 0 0 var(--ember); }
    .area.dragged, .chip-device.dragged { opacity: .4; }
    .area-head { display: flex; align-items: center; gap: .6rem; min-height: 1.75rem; }
    .area-name { font-weight: 500; }
    .area-head .fold-actions { margin-left: auto; padding-right: 0; }
    .grip { display: inline-grid; place-items: center; flex: none; width: 1.3rem; height: 1.3rem;
            border-radius: .3rem; color: var(--muted); cursor: grab;
            transition: color var(--dur-fast), background-color var(--dur-fast); }
    .grip:hover { color: var(--fg); background: var(--sunk); }
    .grip:active { cursor: grabbing; }
    .grip .icon { width: .8rem; height: .8rem; }
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; min-height: 1.9rem;
             margin: .4rem 0 0; padding: 0; list-style: none; border-radius: .4rem;
             transition: background-color var(--dur-fast), box-shadow var(--dur-fast); }
    .chip-device { display: inline-flex; align-items: center; gap: .15rem;
                   padding: .15rem .65rem .15rem .2rem; font-size: .85rem; cursor: grab;
                   background: var(--bg); border: 1px solid var(--line); border-radius: 1rem;
                   transition: border-color var(--dur-fast), translate var(--dur-fast) var(--ease-out),
                               opacity var(--dur-fast); }
    .chip-device:hover { border-color: var(--muted); translate: 0 -1px; }
    .chip-device:active { cursor: grabbing; }
    .chip-device .grip { width: 1.1rem; height: 1.1rem; cursor: inherit; background: none; }
    .unassigned { padding: .55rem .8rem .65rem; border: 1px solid var(--line); border-radius: .5rem; }
    /* The composer: a quiet call that opens, where the new thing will appear, into a field. */
    .namer-call { display: inline-flex; align-items: center; gap: .4rem;
                     padding: .3rem .65rem .3rem .45rem; font: inherit; font-size: .85rem;
                     color: var(--muted); background: transparent; cursor: pointer;
                     border: 1px dashed var(--line); border-radius: .4rem;
                     transition: color var(--dur-fast), border-color var(--dur-fast); }
    .namer-call:hover, .namer.open .namer-call { color: var(--ember);
                                                          border-color: var(--ember); }
    .namer-plus { transition: rotate var(--dur-base) var(--ease-spring); }
    .namer.open .namer-plus { rotate: 45deg; }
    .namer-plus .icon { width: .9rem; height: .9rem; }
    .namer-form { padding: .5rem 0 .15rem; }
    .namer-form input[type="text"] { flex: 1 1 10rem; min-width: 0; }
    .namer .why { margin: .2rem 0 0; }
    .areas > .namer { padding: 0 .8rem; }
    .areas > .namer:has(.namer-call) { padding: .5rem .8rem; border-top: 1px solid var(--line); }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line);
               border-radius: .4rem; overflow: hidden; background: var(--card); }
    .inline-form .stepper button { padding: .3rem .65rem; border: none; border-radius: 0; }
    .stepper output { min-width: 4.4rem; text-align: center; font: .8rem var(--mono); }
    /* A small button that is only an icon. Remove asks once more before it does anything:
       pressed, it widens into the question. */
    .icon-button { display: inline-flex; align-items: center; justify-content: center;
                   min-width: 1.75rem; height: 1.75rem; padding: 0; font: inherit;
                   color: var(--muted); background: transparent; cursor: pointer;
                   border: 1px solid transparent; border-radius: .4rem;
                   transition: color var(--dur-fast), border-color var(--dur-fast),
                               background-color var(--dur-fast), padding var(--dur-base) var(--ease-out); }
    .icon-button:hover { color: var(--fg); border-color: var(--line); }
    .icon-button .icon { width: .95rem; height: .95rem; }
    .icon-button.delete:hover { color: #b4342c; border-color: #b4342c; }
    .asking-words { max-width: 0; overflow: hidden; opacity: 0; font-size: .8rem;
                    white-space: nowrap;
                    transition: max-width var(--dur-base) var(--ease-out),
                                opacity var(--dur-base), margin var(--dur-base) var(--ease-out); }
    .icon-button.delete.asking { padding: 0 .55rem; color: #fff; background: #b4342c;
                                 border-color: #b4342c; }
    .icon-button.asking .asking-words { max-width: 5rem; margin-left: .35rem; opacity: 1; }
    html[data-nav="place"] .floor .fold-row.open .area,
    html[data-nav="place"] .floor .fold-row.open .chip-device,
    html[data-nav="place"] .unassigned .chip-device { view-transition-name: var(--vt); }

    /* The Floorplan: a canvas that takes the whole page, with its controls floating over it.
       Everything drawn is in centimetres of the home; only the transform on each group turns
       those into pixels, so walls, grid and markers can't disagree about where anything is. */
    main.full { max-width: none; padding: 0; position: relative; display: flex;
                flex-direction: column; }
    /* An extension's own page (app_frame.rs): the whole of what the sidebar leaves. */
    .app-frame { flex: 1; width: 100%; min-height: 100vh; border: 0; display: block;
                 background: var(--bg); }
    .app-frame.hidden { display: none; }
    main.full > .card { margin: 2rem auto; max-width: 40rem; }
    .floorplan { position: relative; flex: 1; min-height: 24rem; overflow: hidden;
                 background: var(--bg); }
    .floorplan .canvas { position: absolute; inset: 0; cursor: grab; touch-action: none;
                         user-select: none; }
    .floorplan .canvas:active { cursor: grabbing; }
    .floorplan.editing .canvas.drawing, .floorplan.editing .canvas.drawing:active {
        cursor: crosshair; }
    .floorplan .plan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* Metres heavy, the snap step faint under them: what you see is what a point lands on. */
    .floorplan .grid path { stroke: var(--line); stroke-width: 1; }
    .floorplan .grid .fine-line { opacity: .45; }
    .floorplan .wall { stroke: var(--fg); stroke-linecap: butt; }
    .floorplan .wall.chosen { stroke: var(--ember); }
    .floorplan .jamb { stroke: var(--fg); stroke-linecap: butt; }
    .floorplan .door { stroke: var(--muted); stroke-linecap: round; }
    .floorplan .door.chosen, .floorplan .window.chosen { stroke: var(--ember); }
    .floorplan .window { stroke: var(--muted); stroke-linecap: butt; }
    .floorplan .pending line { stroke: var(--ember); stroke-width: 2; stroke-dasharray: 6 4; }
    .floorplan .pending circle { fill: var(--ember); stroke: none; }
    .floorplan .handles circle { fill: var(--card); stroke: var(--ember); stroke-width: 2; }

    /* Rooms: the shape under the walls, tinted so two side by side can be told apart. Low
       enough to read as a wash over the paper — a plan is drawn in lines, not blocks. */
    .floorplan .area { stroke: none; }
    .floorplan .area.chosen { stroke: var(--ember); stroke-width: 2; stroke-dasharray: 6 4; }
    .floorplan .tint-0 { fill: #c4552b; fill-opacity: .10; }
    .floorplan .tint-1 { fill: #3f6f5b; fill-opacity: .12; }
    .floorplan .tint-2 { fill: #5b6b9c; fill-opacity: .12; }
    .floorplan .tint-3 { fill: #9c7a3f; fill-opacity: .12; }
    .floorplan .tint-4 { fill: #8a5b7a; fill-opacity: .12; }
    .floorplan .tint-5 { fill: #4f7f8a; fill-opacity: .12; }
    .floorplan .room-label { position: absolute; transform: translate(-50%, -50%);
                             pointer-events: none; color: var(--muted); white-space: nowrap;
                             font: .75rem var(--mono); letter-spacing: .06em;
                             text-transform: uppercase; }
    /* Only while editing is a name a thing to grab; reading the plan it must not steal a pan. */
    .floorplan .room-label.movable { pointer-events: auto; cursor: move; }

    /* The floor below, to line an upstairs up with. */
    .floorplan .ghost line { stroke: var(--fg); opacity: .12; stroke-linecap: butt; }

    /* The room being traced, before it closes. */
    .floorplan .tracing polygon { fill: var(--ember); fill-opacity: .08; stroke: var(--ember);
                                  stroke-width: 2; stroke-dasharray: 6 4; }
    .floorplan .tracing circle { fill: var(--ember); stroke: none; }
    .floorplan .tracing .close { fill: none; stroke: var(--ember); stroke-width: 2; }

    /* The length of the wall being drawn, beside the pointer. */
    .floorplan .measure { position: absolute; transform: translate(.9rem, -1.6rem);
                          padding: .1rem .35rem; border-radius: .25rem; pointer-events: none;
                          background: var(--ember); color: var(--card);
                          font: .7rem var(--mono); white-space: nowrap; }

    /* The angle the next line makes with the one before it, at the corner it turns on. */
    .floorplan .angle { position: absolute; transform: translate(-50%, -50%);
                        padding: .1rem .35rem; border-radius: .25rem; pointer-events: none;
                        background: var(--card); color: var(--ember);
                        border: 1px solid var(--line); font: .7rem var(--mono);
                        white-space: nowrap; }

    /* The arc of the same corner, drawn between the two lines it turns through. */
    .floorplan .angle-arc polyline { stroke: var(--ember); stroke-width: 1.5;
                                     stroke-dasharray: 3 3; fill: none; }

    /* Devices on the plan. HTML rather than SVG: a marker is a control with a name, and its
       size must not follow the zoom — a label is either readable or it isn't. */
    .floorplan .markers { position: absolute; inset: 0; pointer-events: none; }
    .floorplan .marker { position: absolute; transform: translate(-50%, -50%);
                         display: flex; align-items: center; gap: .4rem; pointer-events: auto;
                         padding: .25rem .5rem .25rem .35rem; font: inherit; font-size: .8rem;
                         color: var(--fg); background: var(--card); cursor: pointer;
                         border: 1px solid var(--line); border-radius: 1rem;
                         box-shadow: 0 1px 3px rgb(0 0 0 / .12); white-space: nowrap; }
    .floorplan .marker.switchable:hover, .floorplan .marker.movable:hover {
        border-color: var(--ember); }
    /* Not a control: a device with nothing to switch, or one that isn't answering. It still
       shows what it knows, it just doesn't invite a click. */
    .floorplan .marker:disabled { cursor: default; }
    .floorplan .marker .pip { width: .55rem; height: .55rem; flex: none; border-radius: 50%;
                              background: var(--muted); }
    .floorplan .marker.on { border-color: var(--ember); }
    .floorplan .marker.on .pip { background: var(--ember); box-shadow: 0 0 .5rem var(--ember); }
    .floorplan .marker.offline { opacity: .55; }
    .floorplan .marker.chosen { outline: 2px solid var(--ember); outline-offset: 2px; }
    .floorplan .marker.movable { cursor: move; }
    .floorplan .marker:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

    /* Floating over the canvas: the page's own heading and what it can do. */
    .floorplan .plan-head { position: absolute; top: 0; left: 0; right: 0; z-index: 2;
                            display: flex; align-items: center; gap: 1rem;
                            padding: 1rem 1.25rem; pointer-events: none; }
    .floorplan .plan-head h1 { font-size: 1.15rem; text-shadow: 0 1px 3px var(--bg); }
    .floorplan .plan-actions { display: flex; gap: .5rem; pointer-events: auto; }
    .floorplan .plan-actions button { padding: .35rem .8rem; font: inherit; font-size: .85rem;
                                      color: var(--fg); background: var(--card);
                                      border: 1px solid var(--line); border-radius: .4rem;
                                      cursor: pointer; }
    .floorplan .plan-actions button:hover { border-color: var(--ember); color: var(--ember); }
    .floorplan .plan-actions button.solid { background: var(--ember); border-color: var(--ember);
                                            color: var(--card); }
    .floorplan .plan-actions button.solid:hover { background: #ab4717; border-color: #ab4717;
                                                  color: var(--card); }

    .floorplan .toolbar { position: absolute; top: 4rem; left: 1.25rem; z-index: 2;
                          display: flex; flex-direction: column; gap: .25rem; padding: .3rem;
                          background: var(--card); border: 1px solid var(--line);
                          border-radius: .5rem; box-shadow: 0 1px 4px rgb(0 0 0 / .1); }
    .floorplan .toolbar button { display: grid; place-items: center; width: 2.1rem;
                                 height: 2.1rem; padding: 0; color: var(--muted);
                                 background: transparent; border: 1px solid transparent;
                                 border-radius: .4rem; cursor: pointer; }
    .floorplan .toolbar button:hover { color: var(--fg); background: var(--sunk); }
    .floorplan .toolbar button.chosen { color: var(--card); background: var(--ember);
                                        border-color: var(--ember); }
    .floorplan .toolbar button:disabled { opacity: .35; cursor: default; background: none; }
    .floorplan .toolbar button svg { width: 1.15rem; height: 1.15rem; display: block; }
    .floorplan .tool-gap { height: 1px; margin: .2rem .3rem; background: var(--line); }

    /* Which device is about to be put down. */
    .floorplan .device-picker { position: absolute; top: 4rem; left: 4.6rem; z-index: 2;
                                width: 13rem; max-height: 60%; overflow-y: auto;
                                padding: .6rem .7rem; background: var(--card);
                                border: 1px solid var(--line); border-radius: .5rem;
                                box-shadow: 0 1px 4px rgb(0 0 0 / .1); }
    .floorplan .device-picker h2 { margin: 0 0 .4rem; font: .65rem var(--mono);
                                   letter-spacing: .08em; text-transform: uppercase;
                                   color: var(--muted); }
    .floorplan .device-picker ul { margin: 0; padding: 0; list-style: none; }
    .floorplan .device-picker li { padding: 0; }
    .floorplan .device-picker button { display: flex; align-items: baseline; gap: .4rem;
                                       width: 100%; padding: .3rem .4rem; font: inherit;
                                       font-size: .85rem; text-align: left; color: var(--fg);
                                       background: transparent; border: 1px solid transparent;
                                       border-radius: .3rem; cursor: pointer; }
    .floorplan .device-picker button:hover { background: var(--sunk); }
    .floorplan .device-picker button.chosen { color: var(--card); background: var(--ember);
                                              border-color: var(--ember); }
    .floorplan .device-picker button.chosen .badge { color: var(--card); }
    .floorplan .device-picker .name { overflow: hidden; text-overflow: ellipsis; }
    .floorplan .device-picker .badge { margin-left: auto; font-size: .6rem; }

    /* A room, faintly, where the plan will go. Sits in the middle of the canvas whatever the
       zoom is: it's a picture of a floorplan, not one. */
    /* Nothing drawn: the shape of what this page is for, and what to do about it. */
    .floorplan .empty-plan { position: absolute; top: 50%; left: 50%; z-index: 1;
                             transform: translate(-50%, -50%); display: flex;
                             flex-direction: column; align-items: center; gap: .4rem;
                             max-width: min(34rem, 90%); pointer-events: none;
                             text-align: center; }
    .floorplan .empty-plan p { margin: 0; }
    .floorplan .empty-title { color: var(--muted); font-size: .95rem; font-weight: 500; }
    .floorplan .empty-lede { color: var(--muted); font-size: .82rem; opacity: .8; }
    .floorplan .empty-plan button { margin: .35rem 0 .15rem; padding: .4rem .8rem; font: inherit;
                                    font-size: .85rem; pointer-events: auto; cursor: pointer;
                                    color: var(--fg); background: var(--card);
                                    border: 1px solid var(--line); border-radius: .4rem; }
    .floorplan .empty-plan button.solid { background: var(--ember); border-color: var(--ember);
                                          color: var(--card); }
    .floorplan .empty-plan button.solid:hover { background: #ab4717; border-color: #ab4717; }
    .floorplan .watermark { width: min(32rem, 100%); height: auto; margin-bottom: .6rem; }
    .floorplan .watermark .wm-wall { stroke: var(--fg); opacity: .16; }
    .floorplan .watermark .wm-glass { stroke: var(--fg); stroke-width: 2.5; opacity: .16; }
    .floorplan .watermark .wm-jamb { stroke: var(--fg); stroke-width: 3; opacity: .14; }
    .floorplan .watermark .wm-swing { stroke: var(--fg); stroke-width: 2.5; opacity: .13; }
    .floorplan .watermark .wm-thing { fill: none; stroke: var(--fg); stroke-width: 2.5;
                                      opacity: .10; }
    .floorplan .watermark .wm-pip circle { fill: var(--ember); stroke: none; opacity: .22; }

    /* What's picked up, and the numbers worth changing about it. */
    .floorplan .inspector { width: 12rem; padding: .7rem .8rem; background: var(--card);
                            border: 1px solid var(--line); border-radius: .5rem;
                            box-shadow: 0 1px 4px rgb(0 0 0 / .1); }
    .floorplan .inspector h2 { margin: 0 0 .5rem; font: .65rem var(--mono); letter-spacing: .08em;
                               text-transform: uppercase; color: var(--muted); }
    .floorplan .inspector p { margin: 0 0 .4rem; overflow-wrap: anywhere; }
    .floorplan .measure-row { display: flex; justify-content: space-between; gap: .5rem;
                              font-size: .85rem; color: var(--muted); }
    .floorplan .figure { font: .8rem var(--mono); font-variant-numeric: tabular-nums;
                         color: var(--fg); }
    .floorplan .slider { display: grid; grid-template-columns: 1fr auto; gap: .15rem .5rem;
                         align-items: center; font-size: .85rem; color: var(--muted); }
    .floorplan .slider input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0;
                                             accent-color: var(--ember); }

    /* How far apart points may land. */
    .floorplan .snap { display: flex; align-items: center; gap: .5rem; pointer-events: auto; }
    .floorplan .snap-label { color: var(--muted); font: .65rem var(--mono); letter-spacing: .08em;
                             text-transform: uppercase; }
    .floorplan .snap .switcher { background: var(--card); }
    .floorplan .snap .switcher button { padding: .25rem .6rem; font-size: .8rem; }
    .floorplan .snap-step { display: flex; align-items: center; gap: .4rem; }
    .floorplan .snap-step input[type="range"] { width: 6rem; margin: 0; accent-color: var(--ember); }
    .floorplan .snap-step output { min-width: 3.4rem; font: .75rem var(--mono);
                                   font-variant-numeric: tabular-nums; color: var(--muted); }

    /* The right-hand column: which floor, and what's picked up under it. */
    .floorplan .plan-side { position: absolute; top: 1rem; right: 1.25rem; z-index: 2;
                            display: flex; flex-direction: column; align-items: stretch;
                            gap: .5rem; max-height: calc(100% - 6rem); }
    .floorplan .floor-picker { display: flex; flex-direction: column; gap: .2rem;
                               min-width: 9rem; overflow-y: auto; padding: .3rem;
                               background: var(--card); border: 1px solid var(--line);
                               border-radius: .5rem; box-shadow: 0 1px 4px rgb(0 0 0 / .1); }
    .floorplan .floor-picker button { display: grid; gap: .1rem; min-width: 7rem;
                                      padding: .35rem .55rem; font: inherit; text-align: left;
                                      color: var(--fg); background: transparent;
                                      border: 1px solid transparent; border-radius: .35rem;
                                      cursor: pointer; }
    .floorplan .floor-picker button:hover { background: var(--sunk); }
    .floorplan .floor-picker button.chosen { color: var(--card); background: var(--ember);
                                             border-color: var(--ember); }
    .floorplan .floor-name { font-size: .85rem; }
    .floorplan .floor-level { font: .6rem var(--mono); letter-spacing: .08em;
                              text-transform: uppercase; color: var(--muted); }
    .floorplan .floor-picker button.chosen .floor-level { color: var(--card); opacity: .8; }
    .floorplan .add-another { color: var(--muted); font-size: .8rem; }
    .floorplan .add-another:hover { color: var(--ember); }
    .floorplan .add-floor { display: grid; gap: .35rem; padding: .35rem .2rem .2rem;
                            border-top: 1px solid var(--line); margin-top: .2rem; }
    .floorplan .add-floor input { width: 100%; padding: .3rem .45rem; font: inherit;
                                  font-size: .85rem; color: var(--fg); background: var(--bg);
                                  border: 1px solid var(--line); border-radius: .35rem; }
    .floorplan .add-floor input:focus { outline: 2px solid var(--ember); outline-offset: -1px; }
    .floorplan .add-floor .level { display: flex; align-items: center; gap: .4rem;
                                   color: var(--muted); font: .65rem var(--mono);
                                   letter-spacing: .08em; text-transform: uppercase; }
    .floorplan .add-floor .level input { width: 3.5rem; font-family: var(--mono); }
    .floorplan .add-floor-actions { display: flex; gap: .3rem; justify-content: flex-end; }
    .floorplan .add-floor-actions button { min-width: 0; padding: .25rem .6rem; font-size: .8rem;
                                           border-color: var(--line); }
    .floorplan .add-floor-actions button.solid { background: var(--ember);
                                                 border-color: var(--ember); color: var(--card); }
    .floorplan .add-floor-actions button.solid:hover { background: #ab4717;
                                                       border-color: #ab4717; }

    .floorplan .inspector .name { font-size: .9rem; overflow-wrap: anywhere; }

    .floorplan .plan-foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
                            display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem;
                            padding: 1rem 1.25rem; pointer-events: none; }
    .floorplan .zoom { display: flex; gap: .25rem; pointer-events: auto; }
    .floorplan .zoom button { min-width: 2rem; padding: .25rem .5rem; font: inherit;
                              font-size: .85rem; color: var(--fg); background: var(--card);
                              border: 1px solid var(--line); border-radius: .4rem;
                              cursor: pointer; }
    .floorplan .zoom button:hover { border-color: var(--ember); color: var(--ember); }
    .floorplan .hint { margin: 0; flex: 1 1 16rem; min-width: 0; color: var(--muted);
                       font-size: .8rem; text-shadow: 0 1px 3px var(--bg); }
    .floorplan .hint:empty { display: none; }
    .floorplan .plan-banner.note { color: var(--fg); border-color: var(--line); }
    .floorplan .plan-banner { position: absolute; left: 50%; bottom: 4.5rem; z-index: 3;
                              transform: translateX(-50%); margin: 0; padding: .5rem .8rem;
                              color: var(--ember); background: var(--card);
                              border: 1px solid var(--ember); border-radius: .4rem;
                              font-size: .85rem; }

    /* Motion on the plan. The markers and the plan itself are redrawn with every reading and on
       every pan, so they only ever transition — nothing on them plays as it appears. The panels
       around the canvas appear once per Edit or per pick, so those can slide in. */
    .floorplan .toolbar, .floorplan .device-picker {
        animation: from-left var(--dur-base) var(--ease-out) backwards; }
    .floorplan .inspector { animation: from-right var(--dur-base) var(--ease-out) backwards; }
    .floorplan .plan-banner { animation: lift var(--dur-base) var(--ease-out) backwards; }
    /* `translate`, not `transform`: several of these are already placed by their transform. */
    @keyframes from-left { from { opacity: 0; translate: -8px 0; } }
    @keyframes from-right { from { opacity: 0; translate: 8px 0; } }
    @keyframes lift { from { opacity: 0; translate: 0 6px; } }

    /* The tool in hand and the floor shown: a highlight that slides between them. */
    .floorplan .toolbar > .glide { left: .3rem; right: .3rem; border-radius: .4rem;
                                   background: var(--ember); }
    .floorplan .floor-picker { position: relative; }
    .floorplan .floor-picker > .glide { left: .3rem; right: .3rem; border-radius: .35rem;
                                        background: var(--ember); }
    .floorplan .toolbar button, .floorplan .floor-picker > button { position: relative;
                                                                    z-index: 1; }
    .floorplan .floor-picker > button.chosen { background: transparent; border-color: transparent; }
    @media (min-width: 721px) {
      .floorplan .toolbar button.chosen { background: transparent; border-color: transparent; }
    }

    /* Devices: a marker leans in under the pointer and gives under a press; a lamp's pip warms
       up rather than snapping on, and sends out one ring as it does. */
    .floorplan .marker { transition: scale var(--dur-base) var(--ease-spring),
                                     box-shadow var(--dur-base) var(--ease-out),
                                     border-color var(--dur-base), opacity var(--dur-base); }
    .floorplan .marker.switchable:hover, .floorplan .marker.movable:hover { scale: 1.06; }
    .floorplan .marker.switchable:active, .floorplan .marker.movable:active { scale: .96; }
    .floorplan .marker .pip { position: relative;
                              transition: background-color var(--dur-base) var(--ease-out),
                                          box-shadow var(--dur-base) var(--ease-out); }
    .floorplan .marker.on .pip::after { content: ""; position: absolute; inset: 0;
                                        border-radius: 50%; pointer-events: none;
                                        animation: ring .6s var(--ease-out) forwards; }
    @keyframes ring {
        from { box-shadow: 0 0 0 0 rgba(196, 85, 43, .55); }
        to { box-shadow: 0 0 0 .7rem rgba(196, 85, 43, 0); }
    }

    /* Held, a marker lifts off the plan; put down, it settles with a bounce. A motion sensor
       that senses someone lights its pip. */
    .floorplan .marker.lifted { scale: 1.12;
                                box-shadow: 0 .6rem 1.2rem rgba(28, 23, 20, .22); }
    .floorplan .marker.dropped { animation: settle-down 520ms var(--ease-bounce); }
    @keyframes settle-down { from { scale: 1.14; } }
    .floorplan .marker.sensing .pip { background: var(--ember);
                                      box-shadow: 0 0 .5rem var(--ember); }

    /* The plan, alive (floorplan/ambience.rs): a lit light's warm pool, as bright as the light
       and stopped by its room's walls, fading as the light changes; a motion sensor's ripples
       spreading across its room while it senses someone. With motion off the ripples stand
       still as a faint ring — still saying someone's there. */
    .floorplan .pool { transition: opacity var(--dur-expressive) var(--ease-out); }
    .floorplan .ripple circle { fill: none; stroke: var(--ember); stroke-width: 2;
                                vector-effect: non-scaling-stroke; opacity: .3; scale: .6;
                                transform-box: fill-box; transform-origin: center;
                                animation: ripple 1.8s var(--ease-out) infinite; }
    .floorplan .ripple .later { animation-delay: .9s; }
    @keyframes ripple { from { scale: .08; opacity: .6; } to { scale: 1; opacity: 0; } }
    @media (prefers-color-scheme: dark) {
      .floorplan .pool { mix-blend-mode: screen; }
    }

    /* Changing floor (transition.rs `around`): the plan, and only the plan, moves — going up,
       the floor below sinks away and the one above comes down into view. */
    .floorplan .canvas { view-transition-name: plan; }
    html[data-nav][data-nav^="floor"]::view-transition-old(page),
    html[data-nav][data-nav^="floor"]::view-transition-new(page),
    html[data-nav][data-nav^="floor"]::view-transition-group(plan) { animation: none; }
    html[data-nav][data-nav^="floor"]::view-transition-old(plan) {
        animation: page-away var(--dur-base) var(--ease-out) both; }
    html[data-nav][data-nav^="floor"]::view-transition-new(plan) {
        animation: page-arrive var(--dur-expressive) var(--ease-emphasized) both; }
    html[data-nav="floor-up"] { --away: 0 56px; --from: 0 -56px; }
    /* Changing page onto or off the Floorplan, the plan is part of the page, and moves with it. */
    html[data-nav]:not([data-nav^="floor"])::view-transition-group(plan) { animation: none; }
    html[data-nav]:not([data-nav^="floor"])::view-transition-old(plan) {
        animation: page-away var(--dur-fast) var(--ease-out) both; }
    html[data-nav]:not([data-nav^="floor"])::view-transition-new(plan) {
        animation: page-arrive var(--dur-expressive) var(--ease-emphasized) both; }
    html[data-nav="floor-down"] { --away: 0 -56px; --from: 0 56px; }

    /* What's picked, and what's being drawn: dashed lines that march, the way a selection does
       in any drawing tool. Walls and openings change colour rather than switching. */
    .floorplan .area.chosen, .floorplan .pending line, .floorplan .tracing polygon {
        animation: march .8s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -10; } }
    .floorplan .wall, .floorplan .door, .floorplan .window {
        transition: stroke var(--dur-fast) var(--ease-out); }

    /* On a phone the tools take the width rather than a column down the side of a small canvas. */
    @media (max-width: 720px) {
      .floorplan .toolbar { top: auto; bottom: 4.5rem; left: 1rem; right: 1rem;
                            flex-direction: row; justify-content: center; }
      .floorplan .tool-gap { width: 1px; height: auto; margin: .3rem .2rem; }
      .floorplan .toolbar > .glide { display: none; }
      .floorplan .device-picker { top: 4rem; left: 1rem; right: 1rem; width: auto; }
      .floorplan .inspector { width: auto; }
      .floorplan .plan-side { top: 4rem; right: 1rem; max-height: 45%; }
      .floorplan .floor-picker { min-width: 0; }
      .floorplan .plan-foot { align-items: flex-start; }
    }

    /* A window over the page, for a job with its own Save and Cancel: an extension's settings,
       or adding a device. Both used to open in place and push the page around them down. */
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center;
                      justify-content: center; padding: 1.5rem 1rem;
                      background: rgba(28, 23, 20, .45); }
    .modal { width: 100%; max-width: 34rem; max-height: 100%; display: flex;
             flex-direction: column; background: var(--card); border: 1px solid var(--line);
             border-radius: .6rem; box-shadow: 0 1.5rem 3rem rgba(28, 23, 20, .25); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
                  padding: .9rem 1.25rem; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 1.05rem; }
    .modal-close { width: 2rem; height: 2rem; padding: 0; font: inherit; font-size: 1.3rem;
                   line-height: 1; color: var(--muted); background: transparent;
                   border: 1px solid transparent; border-radius: .4rem; cursor: pointer; }
    .modal-close:hover { color: var(--ember); border-color: var(--line); }
    .modal-body { padding: 1rem 1.25rem 1.25rem; overflow-y: auto; }
    /* A window arrives: the page dims behind it and the window rises into place. Once per
       opening — a window is fixed markup around whatever redraws inside it. */
    .modal-backdrop { animation: dim var(--dur-base) var(--ease-out) backwards; }
    .modal { animation: rise-in var(--dur-layout) var(--ease-emphasized) backwards; }
    @keyframes dim { from { background: rgba(28, 23, 20, 0); } }
    @keyframes rise-in { from { opacity: 0; translate: 0 .75rem; scale: .98; } }

    /* Asking before something that can't be taken back. */
    .confirm p { margin: 0 0 .6rem; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; }
    .confirm-actions button { padding: .45rem .9rem; font: inherit; font-size: .9rem;
                              color: var(--fg); background: var(--card);
                              border: 1px solid var(--line); border-radius: .4rem; cursor: pointer; }
    .confirm-actions button:hover { border-color: var(--muted); }
    .confirm-actions .danger-solid { color: #fff; background: #b4342c; border-color: #b4342c; }
    .confirm-actions .danger-solid:hover { background: #982b24; border-color: #982b24; }
    /* In a window of its own, the form needs no rule dividing it off from a card above it. */
    .modal .settings-form { margin-top: 0; padding-top: 0; border-top: none; }
    .modal .add-device { margin: 0; }

    /* What a setting is for, in the words its own extension used to describe it. A line under
       the field rather than a `title=` tooltip, which a phone can't show at all. */
    .settings-help { color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .settings-required { margin-left: .4rem; color: var(--ember); font: .65rem var(--mono);
                         letter-spacing: .08em; text-transform: uppercase; }
    .settings-field .choices { margin-top: .15rem; }
    .settings-advanced { border: 1px solid var(--line); border-radius: .4rem;
                         padding: .5rem .75rem; }
    .settings-advanced summary { cursor: pointer; font-size: .85rem; color: var(--muted); }
    .settings-advanced[open] summary { margin-bottom: .5rem; color: var(--fg); }
    .settings-advanced .settings-field { margin-top: .6rem; }

    /* Not a failure: it's waiting on a person, and the way out is the button beside it. */
    .state.wants-setup { color: var(--ember); }
    .ext-settings-btn.wants-setup { width: auto; padding: 0 .7rem; font-size: .85rem;
                                    color: var(--ember); border-color: var(--ember); }

    /* Step one of adding a device: the extensions as things to press, not a list that expands.
       They come in one after another when the window opens. */
    .protocol-cards { display: grid; gap: .6rem; margin-top: .8rem;
                      grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); }
    .protocol-card { display: flex; flex-direction: column; align-items: flex-start; gap: .3rem;
                     padding: .8rem; font: inherit; text-align: left; color: inherit;
                     background: var(--card); border: 1px solid var(--line); border-radius: .5rem;
                     cursor: pointer;
                     animation: rise var(--dur-base) var(--ease-out) backwards;
                     animation-delay: calc(var(--i, 0) * 45ms); }
    .protocol-card:hover { border-color: var(--ember); translate: 0 -2px;
                           box-shadow: 0 .4rem 1rem rgba(28, 23, 20, .08); }
    .protocol-card .protocol-icon { width: 1.75rem; height: 1.75rem; margin-bottom: .2rem; }
    .protocol-card .name { font-weight: 500; }
    .protocol-card-counts { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    /* A secondary action in the window: a small bordered button, not a word to find. */
    .quiet-button { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .65rem;
                    font: inherit; font-size: .82rem; color: var(--muted); text-decoration: none;
                    background: var(--card); border: 1px solid var(--line); border-radius: .4rem;
                    cursor: pointer; white-space: nowrap; }
    .quiet-button:hover { color: var(--ember); border-color: var(--ember); }
    .quiet-button svg { width: .9rem; height: .9rem; }
    .protocol-back { margin: 0 0 .75rem; }
    .add-intro { display: flex; align-items: flex-start; gap: 1rem; }
    .add-intro p { margin: 0; flex: 1; }

    /* A number of things found: a small ember pill, the one colour on the page that says
       "something here for you". On the Devices page it sits on the Add device button. */
    .found-count, .count-badge { display: inline-grid; place-items: center; min-width: 1.25rem;
                   height: 1.25rem; padding: 0 .35rem; font: 500 .7rem/1 var(--mono);
                   color: #fff; background: var(--ember); border-radius: 1rem; }
    .found-count.quiet { color: var(--muted); background: var(--sunk); }
    h4 .found-count { margin-left: .45rem; vertical-align: .1em; }
    .add .count-badge { margin-left: .45rem; vertical-align: .05em;
                        animation: pop var(--dur-expressive) var(--ease-bounce) backwards; }
    @keyframes pop { from { scale: 0; } }

    /* Step two: one extension. Its heading is the card that was picked, grown. */
    .add-step-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem;
                     view-transition-name: add-hero; }
    .add-step-head h3 { margin: 0; font-size: 1.05rem; }
    .add-step-head .protocol-icon { width: 1.75rem; height: 1.75rem; }
    .add-step { view-transition-name: add-step; }
    .found, .in-home { margin-top: 1rem; }
    .found-head { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem;
                  margin-bottom: .5rem; }
    .found h4, .in-home h4 { margin: 0; font-size: .7rem; font-family: var(--mono);
                             font-weight: 400; letter-spacing: .08em; text-transform: uppercase;
                             color: var(--muted); }
    .in-home h4 { margin-bottom: .5rem; }
    .found-actions { margin-left: auto; display: flex; gap: .5rem; }
    button.primary { padding: .4rem .85rem; font: inherit; font-size: .85rem; font-weight: 500;
                     color: #fff; background: var(--ember); border: 1px solid var(--ember);
                     border-radius: .4rem; cursor: pointer;
                     animation: rise var(--dur-fast) var(--ease-out) backwards; }
    button.primary:hover { background: #ab4717; border-color: #ab4717; }

    /* A device, as a card: what it is and what it would bring, and one button to bring it in. */
    .device-cards { display: grid; gap: .4rem; margin: 0; padding: 0; list-style: none; }
    .device-card { display: grid; grid-template-rows: 1fr;
                   animation: rise var(--dur-base) var(--ease-out) backwards;
                   animation-delay: calc(min(var(--i, 0), 8) * 40ms);
                   transition: grid-template-rows var(--dur-layout) var(--ease-emphasized),
                               opacity var(--dur-layout), margin var(--dur-layout); }
    .device-card-inner { display: flex; align-items: center; gap: .7rem; min-height: 0;
                         overflow: hidden; padding: .6rem .75rem; color: inherit;
                         text-decoration: none; background: var(--card);
                         border: 1px solid var(--line); border-radius: .5rem;
                         transition: border-color var(--dur-fast), box-shadow var(--dur-base),
                                     background-color var(--dur-fast); }
    .device-card .protocol-icon { flex: none; width: 1.6rem; height: 1.6rem; }
    .device-card-text { display: flex; flex-direction: column; gap: .15rem; min-width: 0;
                        flex: 1; }
    .device-card .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-card-made { color: var(--muted); font-size: .78rem; }
    .provides { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .1rem; }
    .chip { padding: .05rem .4rem; font: .65rem/1.5 var(--mono); color: var(--muted);
            background: var(--sunk); border-radius: .25rem; }
    .chip.quiet { font-style: italic; }
    .found-card.picked .device-card-inner { border-color: var(--ember);
        background: color-mix(in srgb, var(--ember) 5%, var(--card)); }
    .found-card .device-card-inner:hover { border-color: var(--muted); }
    /* One that turned up while the window was open says so, once. */
    .device-card.arrived { animation: arrive var(--dur-expressive) var(--ease-out) backwards; }
    .device-card.arrived .device-card-inner { animation: glow 1.6s var(--ease-out); }
    @keyframes arrive { from { opacity: 0; translate: 0 -6px; scale: .98; } }
    @keyframes glow { from { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 35%, transparent); } }
    /* Added: the check shows, then the card folds away to nothing and the ones below close up. */
    .device-card.leaving { grid-template-rows: 0fr; opacity: 0; margin-bottom: -.4rem;
                           transition-delay: var(--dur-base); pointer-events: none; }

    .add-one { position: relative; flex: none; min-width: 4.2rem; height: 2rem; padding: 0 .8rem;
               font: inherit; font-size: .85rem; font-weight: 500; color: var(--ember);
               background: var(--card); border: 1px solid var(--ember); border-radius: .4rem;
               cursor: pointer; }
    .add-one:hover { color: #fff; background: var(--ember); }
    .add-one-label { transition: opacity var(--dur-fast); }
    .add-one-check { position: absolute; inset: 0; margin: auto; width: 1.1rem; height: 1.1rem;
                     stroke-dasharray: 1; stroke-dashoffset: 1; }
    /* On its way: the word gives way to a turning ring. */
    .add-one.busy .add-one-label, .add-one.done .add-one-label { opacity: 0; }
    .add-one.busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: .9rem;
                           height: .9rem; border: 2px solid currentColor; border-right-color: transparent;
                           border-radius: 50%; animation: turn .7s linear infinite; }
    @keyframes turn { to { rotate: 1turn; } }
    .add-one.done { color: #fff; background: var(--ember); opacity: 1; }
    .add-one.done .add-one-check { stroke-dashoffset: 0;
        transition: stroke-dashoffset var(--dur-expressive) var(--ease-spring); }

    /* A timed action that's open (Zigbee's permit join): the button is its own countdown. A ring
       drains as the time goes, the time left is written beside it, and pressing closes it early
       — which hovering says, by swapping the words. The ring's own motion is a quarter-second
       ease between the readings of the clock, so it glides rather than ticks; with motion off it
       steps, and the written time says the same thing. */
    .add.join-open { display: inline-flex; align-items: center; gap: .5rem; padding-left: .55rem;
                     color: var(--ember); border-color: var(--ember);
                     background: color-mix(in srgb, var(--ember) 9%, var(--card)); }
    .add.join-open:hover { background: color-mix(in srgb, var(--ember) 16%, var(--card)); }
    .join-ring { flex: none; width: 1.25rem; height: 1.25rem; rotate: -90deg;
                 animation: join-ring-in var(--dur-layout) var(--ease-spring) both; }
    .join-ring circle { fill: none; stroke-width: 2.5; }
    .join-ring-track { stroke: color-mix(in srgb, var(--ember) 22%, transparent); }
    .join-ring-left { stroke: var(--ember); stroke-linecap: round; stroke-dasharray: 1;
                      transition: stroke-dashoffset calc(var(--dur-base) * 1.4) linear; }
    @keyframes join-ring-in { from { scale: .3; opacity: 0; } }
    /* Asked, not yet confirmed: a small ring turns in the button until the network answers. */
    .add.join-waiting { display: inline-flex; align-items: center; gap: .5rem; cursor: progress; }
    .join-wait { flex: none; width: .9rem; height: .9rem; border: 2px solid currentColor;
                 border-right-color: transparent; border-radius: 50%;
                 animation: turn .7s linear infinite, join-ring-in var(--dur-layout) var(--ease-spring) both; }
    @media (prefers-reduced-motion: reduce) { .join-wait { animation: none; border-right-color: currentColor; opacity: .6; } }
    /* Both wordings share one cell, so the button is as wide as the longer and doesn't jump. */
    .join-words { display: inline-grid; animation: join-words-in var(--dur-layout) var(--ease-emphasized) both; }
    .join-words > span { grid-area: 1 / 1; text-align: left; white-space: nowrap;
                         transition: opacity var(--dur-fast) var(--ease-out),
                                     translate var(--dur-base) var(--ease-out); }
    .join-word-close { opacity: 0; translate: 0 .35em; }
    .add.join-open:is(:hover, :focus-visible) .join-word-open { opacity: 0; translate: 0 -.35em; }
    .add.join-open:is(:hover, :focus-visible) .join-word-close { opacity: 1; translate: 0; }
    .join-time { min-width: 2.2em; font: .85rem var(--mono); font-variant-numeric: tabular-nums;
                 text-align: right; }
    @keyframes join-words-in { from { opacity: 0; translate: -.4em 0; } }
    /* A finger can't hover: there the button always says what a press does. */
    @media (hover: none) {
      .join-word-open { display: none; }
      .join-word-close { opacity: 1; translate: 0; }
    }

    /* Found, but paired by mistake: a quiet way out beside Add. */
    .unpair-one { flex: none; padding: .3rem .55rem; font-size: .8rem; }

    /* What a refused unpair said, and what removing it anyway means. */
    .confirm-refused { margin: .2rem 0 .6rem; padding: .6rem .75rem; background: var(--sunk);
                       border-left: 3px solid var(--ember); border-radius: .3rem; }
    .confirm-refused p:last-child { margin-bottom: 0; }

    /* Nothing found yet: it's listening, and a ring breathing out from the middle says so. */
    .listening-empty { display: flex; flex-direction: column; align-items: center; gap: .3rem;
                       padding: 1.2rem 1rem; text-align: center; border: 1px dashed var(--line);
                       border-radius: .5rem; }
    .listening-empty p { margin: 0; }
    .listening-empty.closed { padding-block: 1rem; }
    .listening-ring { position: relative; width: .7rem; height: .7rem; margin-bottom: .4rem;
                      border-radius: 50%; background: var(--ember); }
    .listening-ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
                             border: 2px solid var(--ember);
                             animation: ping 1.8s var(--ease-out) infinite; }
    @keyframes ping { to { scale: 3; opacity: 0; } }

    /* Found but locked: the same card, with its key form inside it and a dashed ember edge that
       says it needs something from you before it can be added. The sentence explaining the whole
       list is the section heading's job here. */
    .found .waiting-for > p { display: none; }
    .found .waiting-list { display: grid; gap: .4rem; margin-bottom: .4rem; }
    .found .waiting-list li { padding: .7rem .8rem; background: var(--card);
                              border: 1px dashed var(--ember); border-radius: .5rem;
                              animation: rise var(--dur-base) var(--ease-out) backwards; }
    .found .waiting-list li:last-child { border-bottom: 1px dashed var(--ember); }

    /* What's already in the home: the same card, pointing to the device's page. */
    .home-card .device-card-inner:hover { border-color: var(--ember); }
    .home-card .home-chevron { flex: none; width: 1rem; height: 1rem; color: var(--muted);
                          transition: translate var(--dur-fast) var(--ease-out), color var(--dur-fast); }
    .home-card .device-card-inner:hover .home-chevron { color: var(--ember); translate: 3px 0; }

    /* Between the two steps (transition.rs `step`): the step being left slides away and the
       next comes in from the side it's going to, while the picked card and the heading become
       each other. The page behind stays still. */
    html[data-nav^="step"]::view-transition-group(root),
    html[data-nav^="step"]::view-transition-group(page) { animation: none; }
    html[data-nav^="step"]::view-transition-old(root),
    html[data-nav^="step"]::view-transition-new(root),
    html[data-nav^="step"]::view-transition-old(page),
    html[data-nav^="step"]::view-transition-new(page) { animation: none; }
    html[data-nav^="step"]::view-transition-group(add-hero) {
        animation-duration: var(--dur-expressive); animation-timing-function: var(--ease-emphasized); }
    html[data-nav="step-in"]::view-transition-old(add-step) {
        animation: step-away-left var(--dur-layout) var(--ease-out) both; }
    html[data-nav="step-in"]::view-transition-new(add-step) {
        animation: step-from-right var(--dur-expressive) var(--ease-emphasized) both; }
    html[data-nav="step-out"]::view-transition-old(add-step) {
        animation: step-away-right var(--dur-layout) var(--ease-out) both; }
    html[data-nav="step-out"]::view-transition-new(add-step) {
        animation: step-from-left var(--dur-expressive) var(--ease-emphasized) both; }
    @keyframes step-away-left { to { opacity: 0; translate: -2rem 0; } }
    @keyframes step-away-right { to { opacity: 0; translate: 2rem 0; } }
    @keyframes step-from-right { from { opacity: 0; translate: 2rem 0; } }
    @keyframes step-from-left { from { opacity: 0; translate: -2rem 0; } }

    /* Step two: what this one extension has found, waiting and already here. */
    .protocol-found { margin-top: 1rem; }
    .protocol-found-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem;
                           margin: 0 0 .4rem; }
    .protocol-found-head h3 { margin: 0; font-size: .9rem; }
    .protocol-found h3 { margin: 0 0 .4rem; font-size: .9rem; }
    .protocol-found p { margin: 0; }

    /* The log window (log_window.rs): a bar of filters, a search and the copy button, then the
       log itself — one row per line, so it reads down the page rather than across it. */
    .modal.wide { max-width: 60rem; }
    .log-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: .6rem 0; }
    .log-filter button { display: inline-flex; align-items: center; gap: .35rem; }
    .log-count { min-width: 1.2rem; padding: 0 .3rem; font: .65rem/1.4 var(--mono);
                 text-align: center; color: var(--card); background: var(--muted);
                 border-radius: 1rem; }
    .log-filter button:nth-of-type(2) .log-count { background: var(--warn); }
    .log-filter button:nth-of-type(3) .log-count { background: var(--error); }
    .log-filter button .log-count.none { color: var(--muted); background: transparent; }
    .log-search { flex: 1 1 10rem; min-width: 0; padding: .35rem .6rem; font: inherit;
                  font-size: .85rem; color: var(--fg); background: var(--card);
                  border: 1px solid var(--line); border-radius: .4rem; }
    .log-search:focus { outline: 2px solid var(--ember); outline-offset: -1px; }

    /* Copy: an icon, quiet until it's wanted. The clipboard gives way to a check that draws
       itself in when the copy worked, and gives a little shake when the browser said no. */
    .log-copy { display: inline-grid; place-items: center; width: 2.1rem; height: 2.1rem;
                padding: 0; color: var(--muted); background: var(--card);
                border: 1px solid var(--line); border-radius: .4rem; cursor: pointer; }
    .log-copy:hover { color: var(--fg); border-color: var(--muted); }
    .log-copy .copy-icon { width: 1.1rem; height: 1.1rem; overflow: visible; }
    .log-copy .copy-clip { transform-origin: center; transform-box: fill-box;
                           transition: opacity var(--dur-fast), scale var(--dur-base) var(--ease-out); }
    .log-copy .copy-check { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
                            transition: stroke-dashoffset var(--dur-expressive) var(--ease-spring),
                                        opacity var(--dur-fast); }
    .log-copy.done { color: var(--ember); border-color: var(--ember); }
    .log-copy.done .copy-clip { opacity: 0; scale: .6; }
    .log-copy.done .copy-check { stroke-dashoffset: 0; opacity: 1; }
    .log-copy.failed { color: #b4342c; border-color: #b4342c;
                       animation: shake var(--dur-expressive) var(--ease-out); }
    @keyframes shake { 20%, 60% { translate: -3px 0; } 40%, 80% { translate: 3px 0; } }

    /* The log: scrolls in place, newest at the bottom. */
    .log-window { max-height: min(60vh, 34rem); overflow: auto; background: var(--sunk);
                  border-radius: .4rem; font: .78rem/1.5 var(--mono); }
    .log-quiet { margin: 0; padding: .8rem; font-family: var(--sans); }
    .log-lines { margin: 0; padding: .3rem 0; list-style: none; }
    /* A row: when, how serious, and what — the time and the level in columns of their own, so
       the eye can run down either. A long message wraps under itself rather than off the edge. */
    .log-row { display: grid; grid-template-columns: 4.6rem 3.4rem 1fr; gap: .6rem;
               align-items: baseline; padding: .12rem .75rem .12rem calc(.75rem - 2px);
               border-left: 2px solid transparent; }
    .log-row:hover { background: color-mix(in srgb, var(--line) 45%, transparent); }
    .log-row.log-warn { border-left-color: var(--warn);
                        background: color-mix(in srgb, var(--warn) 7%, transparent); }
    .log-row.log-error { border-left-color: var(--error);
                         background: color-mix(in srgb, var(--error) 9%, transparent); }
    /* A line that arrived while the window was open fades in where it lands. */
    .log-row.fresh { animation: log-in var(--dur-layout) var(--ease-out) backwards; }
    @keyframes log-in { from { opacity: 0; translate: 0 4px; } }
    .log-stamp { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .log-level { justify-self: start; padding: 0 .35rem; font-size: .62rem; line-height: 1.5;
                 letter-spacing: .06em; text-transform: uppercase; border-radius: .25rem; }
    .log-level.error { color: var(--card); background: var(--error); font-weight: 600; }
    .log-level.warn { color: var(--warn); border: 1px solid var(--warn); }
    .log-level.info { color: var(--muted); border: 1px solid var(--line); }
    .log-level.debug, .log-level.trace { color: var(--muted); opacity: .7; }
    .log-text { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
    .log-row.log-error .log-message { color: var(--error); font-weight: 600; }
    .log-source { display: inline-block; margin-right: .45rem; padding: 0 .35rem;
                  font-size: .68rem; color: var(--fg); background: var(--card);
                  border: 1px solid var(--line); border-radius: .25rem; }
    .log-field { margin-left: .6rem; color: var(--muted); }
    .log-key { opacity: .75; }
    @media (max-width: 40rem) {
      .log-row { grid-template-columns: auto 1fr; }
      .log-row .log-text { grid-column: 1 / -1; }
    }

    /* While a pairing window is open: what to do now, and what has arrived so far. */
    .listening { margin-top: .6rem; padding: .6rem .75rem; background: var(--sunk);
                 border-radius: .4rem; }
    .listening p { margin: 0; font-size: .85rem; }
    .listening p + p { margin-top: .35rem; }

    @media (max-width: 40rem) {
      .modal-backdrop { padding: 0; align-items: flex-end; }
      .modal { max-width: none; height: 100%; border-radius: 0; border: none; }
    }

    /* The assistant. Ask stays clickable before a model is ready: quiet, not disabled. */
    button.ask { display: inline-flex; align-items: center; gap: .35rem; }
    button.ask .spark { width: .85rem; height: .85rem; color: var(--ember);
                        transition: rotate var(--dur-expressive) var(--ease-spring),
                                    scale var(--dur-base) var(--ease-spring); }
    button.ask:hover .spark { rotate: 90deg; scale: 1.15; }
    button.ask.on { border-color: var(--ember); color: var(--ember); }
    button.ask-quiet, button.ask-quiet .spark { color: var(--muted); }
    button.ask-quiet { border-color: var(--line); background: transparent; }

    /* The chat window an Ask opens: under its button, growing out of the corner nearest it. */
    .ask-pop { position: fixed; z-index: 25; top: var(--top); right: var(--right);
               width: min(26rem, calc(100vw - 1.5rem));
               height: min(34rem, calc(100vh - var(--top) - .75rem));
               transform-origin: top right;
               animation: ask-open var(--dur-expressive) var(--ease-emphasized) backwards; }
    @keyframes ask-open { from { opacity: 0; scale: .92; translate: 0 -.5rem; } }
    .ask-pop .chat { height: 100%; box-shadow: 0 .75rem 2.5rem rgba(28, 23, 20, .22),
                                               0 .1rem .4rem rgba(28, 23, 20, .12); }
    @media (max-width: 720px) {
      /* On a phone it is a sheet from the bottom, whichever button asked. */
      .ask-pop { top: auto; right: 0; bottom: 0; width: 100%; height: min(34rem, 80vh);
                 transform-origin: bottom center; animation-name: ask-sheet; }
      .ask-pop .chat { border-radius: 1rem 1rem 0 0; }
      @keyframes ask-sheet { from { translate: 0 100%; } }
    }
    .chat-page { height: min(42rem, calc(100vh - 9rem)); max-width: 44rem; }
    .chat-page .chat { height: 100%; }

    .chat { display: flex; flex-direction: column; min-height: 0; background: var(--card);
            border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; }
    .chat-head { display: flex; align-items: center; gap: .5rem; padding: .6rem .6rem .6rem .9rem;
                 border-bottom: 1px solid var(--line); }
    .chat-head .spark { flex: none; width: .9rem; height: .9rem; color: var(--ember); }
    .chat-title { flex: 1; min-width: 0; font-weight: 500; font-size: .92rem; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
    .chat-clear, .chat-close { flex: none; padding: .2rem .55rem; font: inherit; font-size: .8rem;
                               color: var(--muted); background: transparent; cursor: pointer;
                               border: 1px solid transparent; border-radius: .4rem; }
    .chat-close { width: 1.8rem; height: 1.8rem; padding: 0; font-size: 1.2rem; line-height: 1; }
    .chat-clear:hover:not(:disabled), .chat-close:hover { color: var(--ember);
                                                          border-color: var(--line); }
    .chat-clear:disabled { opacity: .4; cursor: default; }

    /* It scrolls one way only. Whatever a model writes — a log line, a path, an address with
       no space in it — breaks to fit the window, and nothing here is ever wider than it. */
    .chat-log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex;
                flex-direction: column; gap: .9rem; padding: 1rem .9rem;
                overscroll-behavior: contain; }
    .chat-empty { margin: auto 1rem; text-align: center; color: var(--muted); font-size: .9rem; }
    .turn { max-width: 100%; min-width: 0;
            animation: turn-in var(--dur-layout) var(--ease-out) backwards; }
    @keyframes turn-in { from { opacity: 0; translate: 0 .4rem; } }
    .turn p { margin: 0; }
    /* What was asked sits in a bubble on the right; the answer is the page talking, and
       needs no box. */
    .turn.mine { align-self: flex-end; max-width: 85%; padding: .5rem .8rem; background: var(--sunk);
                 border-radius: 1.1rem 1.1rem .3rem 1.1rem; white-space: pre-wrap;
                 overflow-wrap: anywhere; transform-origin: bottom right;
                 animation: said var(--dur-layout) var(--ease-spring) backwards; }
    @keyframes said { from { opacity: 0; scale: .9; translate: 0 .4rem; } }
    .turn.theirs { align-self: stretch; padding: 0 .15rem; overflow-wrap: anywhere; }
    .turn.writing { animation: none; }
    /* One column that is as wide as the chat and no wider: left to itself a grid column
       grows to fit the longest thing in it that won't break. */
    .rich { display: grid; grid-template-columns: minmax(0, 1fr); gap: .55rem; font-size: .95rem;
            line-height: 1.55; }
    .rich > * { min-width: 0; overflow-wrap: anywhere; }
    .rich p { white-space: pre-wrap; }
    .rich strong { font-weight: 600; }
    .rich-heading { font-weight: 600; }
    .rich-item { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr); gap: .1rem; }
    .rich-mark { color: var(--ember); font: .85em/1.8 var(--mono); }
    .rich-code { margin: 0; padding: .6rem .7rem; background: var(--sunk); white-space: pre-wrap;
                 overflow-wrap: anywhere; border-radius: .5rem; font: .8rem/1.5 var(--mono); }
    /* A value or a state: the thing the answer is about, set apart from the words around it. */
    .rich code.value { padding: .08em .42em; font: 500 .84em var(--mono); color: var(--ember);
                       background: color-mix(in srgb, var(--ember) 11%, transparent);
                       border: 1px solid color-mix(in srgb, var(--ember) 26%, transparent);
                       border-radius: .4em; overflow-wrap: anywhere;
                       -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .chat-phase { display: flex; align-items: center; gap: .5rem; color: var(--muted);
                  font-size: .82rem; }
    .dots { display: inline-flex; gap: .22rem; }
    .dots i { width: .38rem; height: .38rem; border-radius: 50%; background: var(--ember);
              animation: dot 1.1s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 60%, 100% { opacity: .3; translate: 0 0; }
                     30% { opacity: 1; translate: 0 -.22rem; } }
    .chat-trouble { margin: 0; padding: .5rem .7rem; font-size: .85rem; color: var(--error);
                    border: 1px solid color-mix(in srgb, var(--error) 40%, transparent);
                    border-radius: .6rem; animation: drop-in var(--dur-base) var(--ease-out); }

    /* The box to ask in: one rounded field, with the send button inside it on the right. */
    .composer { display: flex; align-items: flex-end; gap: .4rem; margin: 0 .7rem .7rem;
                padding: .35rem .35rem .35rem .85rem; background: var(--bg);
                border: 1px solid var(--line); border-radius: 1.25rem;
                transition: border-color var(--dur-base) var(--ease-out),
                            box-shadow var(--dur-base) var(--ease-out); }
    .composer:focus-within { border-color: var(--ember);
                             box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 16%, transparent); }
    .composer textarea { flex: 1; min-width: 0; max-height: 8rem; padding: .35rem 0; resize: none;
                         font: inherit; font-size: .95rem; line-height: 1.4; color: var(--fg);
                         background: transparent; border: none; outline: none;
                         field-sizing: content; }
    .composer textarea::placeholder { color: var(--muted); }
    .send { flex: none; display: grid; place-items: center; width: 2.1rem; height: 2.1rem;
            padding: 0; color: #fff; background: var(--ember); border: none; border-radius: 50%;
            cursor: pointer;
            transition: scale var(--dur-base) var(--ease-spring),
                        background-color var(--dur-base) var(--ease-out),
                        opacity var(--dur-base) var(--ease-out); }
    .send svg { width: 1.05rem; height: 1.05rem; }
    .send:hover:not(:disabled) { scale: 1.08; }
    .send:active:not(:disabled) { scale: .92; }
    .send:disabled { background: var(--line); color: var(--muted); cursor: default; }
    /* While an answer is on its way the button calls it off. */
    .send.stop { background: var(--fg); color: var(--bg); }

    /* The Settings card. It folds like the others, and says beside its name how it is set. */
    .assistant-card .modes { position: relative; display: grid; grid-template-columns: 1fr 1fr;
                             padding: 4px; margin: .9rem 0 1rem; background: var(--sunk);
                             border: 1px solid var(--line); border-radius: 999px; }
    .assistant-card .modes-thumb { position: absolute; top: 4px; bottom: 4px; left: 4px;
                                   width: calc((100% - 8px) / 2); border-radius: 999px;
                                   background: var(--card); translate: calc(var(--at) * 100%) 0;
                                   box-shadow: 0 1px 3px rgb(0 0 0 / .14);
                                   transition: translate var(--dur-expressive) var(--ease-spring); }
    .assistant-card .modes button { position: relative; z-index: 1; display: flex;
                                    align-items: center; justify-content: center; gap: .4rem;
                                    padding: .5rem .3rem; font: inherit; font-size: .9rem;
                                    font-weight: 500; color: var(--muted); background: none;
                                    border: 0; border-radius: 999px; cursor: pointer;
                                    transition: color var(--dur-base) var(--ease-out); }
    .assistant-card .modes button.on { color: var(--fg); }
    .assistant-card .modes button:not(.on):hover { color: var(--fg); }
    .in-use { width: .45rem; height: .45rem; border-radius: 50%; background: var(--ember); }
    .assistant-card .mode-body { animation: rise var(--dur-layout) var(--ease-out) backwards; }
    .assistant-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
    .assistant-actions.end { justify-content: flex-end; }
    .assistant-card button.primary { padding: .45rem .9rem; font: inherit; font-size: .9rem;
                                     font-weight: 500; color: #fff; background: var(--ember);
                                     border: 1px solid var(--ember); border-radius: .4rem;
                                     cursor: pointer; }
    .assistant-card button.primary:disabled { opacity: .6; cursor: progress; }
    .quiet-button.danger:hover:not(:disabled) { color: #b4342c; border-color: #b4342c; }
    .assistant-progress { display: grid; gap: .3rem; font: .78rem var(--mono); color: var(--muted);
                          animation: drop-in var(--dur-base) var(--ease-out); }
    .assistant-progress .bar { height: .4rem; overflow: hidden; background: var(--sunk);
                               border-radius: 999px; }
    .assistant-progress .bar span { display: block; height: 100%; background: var(--ember);
                                    border-radius: 999px;
                                    transition: width var(--dur-expressive) var(--ease-out); }
    /* No total yet: a band that keeps moving, so it reads as working and not as stuck. */
    .assistant-progress.unknown .bar span { width: 35% !important;
                                            animation: sweep 1.2s ease-in-out infinite alternate; }
    @keyframes sweep { from { translate: -100% 0; } to { translate: 290% 0; } }
    .assistant-models { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
    .assistant-models li { display: flex; align-items: center; gap: .6rem; padding: .4rem .6rem;
                           border: 1px solid var(--line); border-radius: .5rem;
                           font-size: .85rem; letter-spacing: 0; text-transform: none;
                           transition: border-color var(--dur-base) var(--ease-out); }
    .assistant-models li.live { border-color: var(--ember); }
    .assistant-models li > * { letter-spacing: 0; text-transform: none; }
    .assistant-models .name { flex: 1; min-width: 0; font-family: var(--mono);
                              overflow-wrap: anywhere; }
    .in-use-word { font: .72rem var(--mono); color: var(--ember); }
    .assistant-models .loaded { margin-left: .5rem; padding: .05rem .4rem; font: .68rem var(--mono);
                                color: var(--ember); border-radius: 999px;
                                background: color-mix(in srgb, var(--ember) 12%, transparent);
                                animation: pop var(--dur-layout) var(--ease-spring) backwards; }
    .assistant-models .needs { font: .75rem var(--mono); }
    .assistant-models .needs.tight { color: var(--warn); }
    .assistant-memory { display: grid; gap: .3rem; font: .75rem var(--mono); color: var(--muted); }
    .assistant-memory .bar { height: .3rem; overflow: hidden; background: var(--sunk);
                             border-radius: 999px; }
    .assistant-memory .bar span { display: block; height: 100%; background: var(--muted);
                                  border-radius: 999px;
                                  transition: width var(--dur-expressive) var(--ease-out); }
    .assistant-ollama { display: grid; gap: .6rem; padding-bottom: .9rem;
                        border-bottom: 1px solid var(--line); }
    .assistant-ollama-state { margin: 0; font-size: .9rem; }
    .assistant-card .field { display: grid; gap: .25rem; }
    .assistant-card .field > span { color: var(--muted); font: .7rem var(--mono);
                                    letter-spacing: .08em; }
    .chat-waited { font: .75rem var(--mono); opacity: .8; }
    .chat-slow { color: var(--muted); font-size: .8rem;
                 animation: drop-in var(--dur-base) var(--ease-out); }
    .chat-trouble p { margin: 0; overflow-wrap: anywhere; }
    /* How much of the model's context the last answer took: a share of it where the whole is
       known (a model on this machine), and otherwise the count. */
    .chat-context { flex: none; display: inline-flex; align-items: center; gap: .35rem;
                    font: .7rem var(--mono); color: var(--muted); cursor: default; }
    .chat-context .bar { width: 2rem; height: .3rem; overflow: hidden; background: var(--sunk);
                         border-radius: 999px; }
    .chat-context .bar span { display: block; height: 100%; background: var(--muted);
                              border-radius: 999px;
                              transition: width var(--dur-expressive) var(--ease-out); }
    .chat-context.high { color: var(--warn); }
    .chat-context.high .bar span { background: var(--warn); }
    .assistant-context { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
    .assistant-context input { width: 8rem; padding: .45rem .6rem; font-family: var(--mono); }
    .assistant-instructions { margin-top: 1.1rem; padding-top: 1rem;
                              border-top: 1px solid var(--line); }
    .assistant-instructions textarea { width: 100%; min-height: 5.5rem; font: inherit;
                                       font-size: .9rem; line-height: 1.45; }
    .chat-trouble-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
    .assistant-detail { margin: 0; font-size: .85rem; color: var(--warn); }
    .assistant-detail.ok { color: var(--muted); }
    .assistant-off { margin: 1rem 0 0; padding-top: .8rem; border-top: 1px solid var(--line); }
  </style>
</head>
