<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IroriOS</title>
  <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int">
  <link data-trunk rel="copy-file" href="../irori/assets/favicon.svg">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Brand tokens (assets/README.md). Fonts are never downloaded: the UI works offline. */
    :root {
      color-scheme: light dark;
      --ink: #1c1714; --paper: #faf7f4; --ember: #c4552b; --muted: #6b625b;
      --fg: var(--ink); --bg: var(--paper); --line: #e6dfd8; --card: #fffdfb; --sunk: #efe9e3;
      /* A warning: amber, quieter than the ember a failure gets. */
      --warn: #a8560a;
      /* A failure, as text: the ember, deepened until it reads on the page. */
      --error: #a8431f;
      --sans: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      /* Motion: quick, and small. A control panel is used every day, so nothing should make
         anyone wait for it; motion here says "that worked" or "still working", not "look". */
      --dur-fast: 120ms; --dur-base: 180ms;
      /* For things that move the layout around them, or travel across the page: a drawer
         rolling down, the page changing. Still short — the eye has further to go, not longer
         to wait. */
      --dur-layout: 240ms;
      /* For the moments that are the point: a page arriving, a tile becoming a page, a floor
         changing, a number counting to where it's going. Long enough to be seen, never long
         enough to wait for. */
      --dur-expressive: 340ms;
      --ease-out: cubic-bezier(.2, .7, .3, 1);
      /* A mild overshoot, for the few things that are pushed around by a finger: the toggle's
         knob and a slider's thumb. */
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
      /* Arrives fast and settles long: for things crossing the page. */
      --ease-emphasized: cubic-bezier(.2, 0, 0, 1);
      /* A proper bounce, for things that are let go of: a thumb released, a marker put down. */
      --ease-bounce: cubic-bezier(.34, 1.9, .5, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: var(--paper); --bg: var(--ink); --muted: #a89e96; --line: #3a322d;
              --card: #241e1a; --sunk: #17120f; --warn: #e8a05c;
              --error: #e07a4d; }
    }
    * { box-sizing: border-box; }
    /* Jumps within a page glide there — with motion on. */
    html { scroll-behavior: smooth; }
    html[data-motion="off"] { scroll-behavior: auto; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    /* Motion off: when the system asks for less motion, or Settings says so. Nothing moves, and
       every change lands at once — the page says the same things, just without the travel. */
    @media (prefers-reduced-motion: reduce) {
      :root { --dur-fast: 0ms; --dur-base: 0ms; --dur-layout: 0ms; --dur-expressive: 0ms; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
          animation: none !important; }
    }
    html[data-motion="off"]::view-transition-group(*),
    html[data-motion="off"]::view-transition-old(*),
    html[data-motion="off"]::view-transition-new(*) { animation: none !important; }
    .shell[data-motion="off"] { --dur-fast: 0ms; --dur-base: 0ms; --dur-layout: 0ms;
                                --dur-expressive: 0ms; }
    .shell[data-motion="off"] *, .shell[data-motion="off"] *::before,
    .shell[data-motion="off"] *::after { animation: none !important; transition: none !important; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans); }
    /* Hidden means hidden, whatever an element's own rule says its display is. */
    [hidden] { display: none !important; }

    /* Every box that is typed in looks the same wherever it is: the page's own colours, a thin
       line, an ember ring while it has the cursor. Zero specificity, so a place that needs a
       different size or font just says so. */
    :where(input:not([type="range"], [type="checkbox"], [type="radio"], [type="color"]),
           textarea) {
        padding: .3rem .5rem; font: inherit; font-size: .9rem; color: var(--fg);
        background: var(--bg); border: 1px solid var(--line); border-radius: .4rem;
        transition: border-color var(--dur-fast); }
    :where(input:not([type="range"], [type="checkbox"], [type="radio"], [type="color"]),
           textarea):hover:not(:disabled, :focus) { border-color: var(--muted); }
    :where(input:not([type="range"], [type="checkbox"], [type="radio"], [type="color"]),
           textarea):focus { outline: 2px solid var(--ember); outline-offset: -1px; }
    :where(input, textarea)::placeholder { color: var(--muted); opacity: .8; }
    :where(input, textarea):disabled { opacity: .55; cursor: not-allowed; }
    /* A number is typed, or nudged with the arrow keys: the browser's own little arrows are
       the operating system's, and take a third of a box this size. */
    input[type="number"] { appearance: textfield; -moz-appearance: textfield;
                           font-variant-numeric: tabular-nums; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { appearance: none; margin: 0; }

    /* Changing page (src/transition.rs says which change it is, as `data-nav` on <html>). The
       shell stays put — its sidebar highlight glides on its own — and the page moves: up from
       below for a page further down the sidebar, down from above for one further up, sideways
       between the device list and a device (whose name travels between its row and the
       heading), and growing out of a Start tile into the page it opens. */
    main { view-transition-name: page; }
    ::view-transition-group(root), ::view-transition-old(root),
    ::view-transition-new(root) { animation: none; }
    html:not([data-nav])::view-transition-group(*),
    html:not([data-nav])::view-transition-old(*),
    html:not([data-nav])::view-transition-new(*) { animation: none; }
    html[data-nav]::view-transition-group(*) {
        animation-duration: var(--dur-expressive); animation-timing-function: var(--ease-emphasized); }
    html[data-nav]::view-transition-group(page) { animation: none; }
    html[data-nav]::view-transition-old(page) {
        animation: page-away var(--dur-fast) var(--ease-out) both; }
    html[data-nav]::view-transition-new(page) {
        animation: page-arrive var(--dur-expressive) var(--ease-emphasized) both; }
    html[data-nav="down"] { --away: 0 -12px; --from: 0 36px; }
    html[data-nav="up"] { --away: 0 12px; --from: 0 -36px; }
    html[data-nav="into-device"] { --away: -16px 0; --from: 32px 0; }
    html[data-nav="to-list"] { --away: 16px 0; --from: -32px 0; }
    html[data-nav="fade"] { --away: 0 0; --from: 0 0; }
    html[data-nav="tile"] { --away: 0 0; --from: 0 24px; }
    @keyframes page-away { to { opacity: 0; translate: var(--away); } }
    @keyframes page-arrive { from { opacity: 0; translate: var(--from); } }
    /* A Start tile, clicked, grows into the heading of the page it opens: the tile is `hero`
       for the change (transition.rs), and so is the new page's heading row — the browser grows
       one into the other while the rest of the page rises in behind. */
    html[data-nav="tile"] .page-head { view-transition-name: hero; }

    /* The shell: a sidebar that folds down to icons, and the page beside it. The same on every
       page, so nothing moves when you switch. */
    .shell { display: grid; grid-template-columns: 13rem 1fr; min-height: 100vh;
             transition: grid-template-columns var(--dur-base) var(--ease-out); }
    .shell.folded { grid-template-columns: 3.5rem 1fr; }
    main { width: 100%; max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; min-width: 0; }

    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
               gap: .25rem; padding: 1rem .6rem; border-right: 1px solid var(--line);
               background: var(--card); overflow: hidden; }
    .sidebar-top { display: flex; align-items: center; justify-content: space-between;
                   gap: .25rem; margin-bottom: 1rem; }
    .sidebar .mark { position: relative; display: flex; align-items: center; gap: .6rem;
                     padding: .35rem .45rem; color: var(--fg); text-decoration: none;
                     font-weight: 500; border-radius: .4rem; cursor: default;
                     transition: background-color var(--dur-fast); }
    .sidebar .mark .mark-logo { width: 1.5rem; height: 1.5rem; flex: none; overflow: visible; }
    /* Once a model is ready the name is the way to its assistant, and wears Ask's spark:
       after the name, or on the mark's corner when the sidebar is folded. */
    .sidebar a.mark { cursor: pointer; }
    .sidebar a.mark:hover, .sidebar a.mark[aria-current="page"] { background: var(--sunk); }
    .sidebar a.mark[aria-current="page"] .mark-letters { color: var(--ember); }
    .mark-spark { flex: none; width: .8rem; height: .8rem; margin-left: -.3rem;
                  color: var(--ember);
                  animation: pop var(--dur-expressive) var(--ease-spring) backwards;
                  transition: rotate var(--dur-expressive) var(--ease-spring),
                              scale var(--dur-base) var(--ease-spring); }
    .sidebar a.mark:hover .mark-spark { rotate: 90deg; scale: 1.15; }
    .mark-ember { transform-box: fill-box; transform-origin: center; }
    .mark-letters span { display: inline-block; }
    /* A model has just become ready: the name catches, letter by letter from the left, like
       fire along a fuse, while the ember in the mark flares. Then it burns back down to the
       name it was, and is a link (main.rs waits IGNITE, which is these timings added up). */
    .mark.igniting .mark-letters span {
        animation: letter-catch 1.1s var(--ease-out) both;
        animation-delay: calc(var(--i) * 95ms); }
    @keyframes letter-catch {
        0% { color: inherit; text-shadow: none; translate: 0 0; }
        22% { color: #f2994a; translate: 0 -1.5px;
              text-shadow: 0 0 .5em rgba(242, 153, 74, .95), 0 -.25em .7em rgba(196, 85, 43, .7); }
        55% { color: var(--ember); translate: 0 0;
              text-shadow: 0 0 .35em rgba(196, 85, 43, .55); }
        100% { color: inherit; text-shadow: none; }
    }
    .mark.igniting .mark-ember { animation: ember-flare .56s ease-in-out 3; }
    @keyframes ember-flare {
        0%, 100% { scale: 1; filter: none; }
        45% { scale: 1.45; fill: #f2994a;
              filter: drop-shadow(0 0 3px rgba(242, 153, 74, .95))
                      drop-shadow(0 0 7px rgba(196, 85, 43, .8)); }
    }
    .sidebar nav { display: flex; flex-direction: column; gap: .15rem; }
    .sidebar nav a { display: flex; align-items: center; gap: .7rem; padding: .5rem .6rem;
                     border-radius: .4rem; color: var(--muted); text-decoration: none;
                     font-size: .95rem; white-space: nowrap; border-left: 2px solid transparent;
                     transition: color var(--dur-fast), background-color var(--dur-fast),
                                 border-color var(--dur-base) var(--ease-out); }
    .sidebar nav a svg, .sidebar nav a img { width: 1.25rem; height: 1.25rem; flex: none; }
    .sidebar nav a:hover { color: var(--fg); background: var(--sunk); }
    .sidebar nav a[aria-current="page"] { color: var(--fg); background: var(--sunk);
                                          border-left-color: var(--ember); }
    .fold { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; padding: 0;
            color: var(--muted); background: transparent; border: 1px solid transparent;
            border-radius: .4rem; cursor: pointer; flex: none; }
    .fold:hover { color: var(--fg); border-color: var(--line); }
    .fold svg { width: 1rem; height: 1rem; transition: transform var(--dur-base) var(--ease-out); }
    .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: .25rem; }
    .sidebar .settings-link { display: flex; align-items: center; gap: .7rem; padding: .5rem .6rem;
                              border-radius: .4rem; color: var(--muted); text-decoration: none;
                              font-size: .95rem; white-space: nowrap;
                              border-left: 2px solid transparent;
                              transition: color var(--dur-fast), background-color var(--dur-fast),
                                          border-color var(--dur-base) var(--ease-out); }
    .sidebar .settings-link svg { width: 1.25rem; height: 1.25rem; flex: none; }
    .sidebar .settings-link:hover { color: var(--fg); background: var(--sunk); }
    .sidebar .settings-link[aria-current="page"] { color: var(--fg); background: var(--sunk);
                                                   border-left-color: var(--ember); }
    .sidebar .live { padding: .5rem .6rem; }

    /* A highlight that glides to whatever is chosen in a column, rather than the choice jumping
       (src/glide.rs measures where; each list says how wide and what colour). It lands without
       travelling the first time, and fades out where nothing is chosen. */
    .glide { position: absolute; top: 0; z-index: 0; pointer-events: none; opacity: 0;
             transition: transform var(--dur-base) var(--ease-out),
                         height var(--dur-base) var(--ease-out),
                         width var(--dur-base) var(--ease-out), opacity var(--dur-fast); }
    .glide[data-shown] { opacity: 1; }
    .glide:not([data-placed]) { transition: opacity var(--dur-fast); }

    /* The sidebar's: the page being shown. The links sit over it and stop drawing their own
       — except on a phone, where they're a row and draw it themselves again. */
    .sidebar > .glide { left: .6rem; right: .6rem; border-radius: .4rem;
                        background: var(--sunk); box-shadow: inset 2px 0 0 var(--ember); }
    .sidebar nav a, .sidebar .settings-link { position: relative; z-index: 1; }
    @media (min-width: 721px) {
      .sidebar nav a[aria-current="page"], .sidebar .settings-link[aria-current="page"] {
          background: transparent; border-left-color: transparent; }
    }
    /* Under the pointer, an icon leans toward its page; the cog turns a notch. */
    .sidebar nav a svg, .sidebar .settings-link svg {
        transition: translate var(--dur-base) var(--ease-spring),
                    rotate var(--dur-base) var(--ease-spring); }
    .sidebar nav a:hover svg { translate: 2px 0; }
    .sidebar .settings-link:hover svg { rotate: 45deg; }

    /* Folded: icons only. Labels stay in the page for screen readers, and in each link's title. */
    .folded .sidebar .label { position: absolute; width: 1px; height: 1px; overflow: hidden;
                              clip: rect(0 0 0 0); white-space: nowrap; }
    .folded .sidebar-top { flex-direction: column; }
    .folded .mark-spark { position: absolute; top: -.05rem; right: -.05rem; width: .7rem;
                          height: .7rem; margin: 0; }
    .folded .fold svg { transform: rotate(180deg); }
    .folded .sidebar nav a { justify-content: center; padding: .5rem 0; }
    .folded .sidebar-bottom { align-items: stretch; }
    .folded .sidebar .settings-link { justify-content: center; padding: .5rem 0; }

    /* A phone has no room beside the page: the sidebar becomes a bar along the top, and folding
       means nothing there. */
    @media (max-width: 720px) {
      .shell, .shell.folded { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; flex-direction: row; align-items: center;
                 padding: .5rem .75rem; border-right: none; border-bottom: 1px solid var(--line); }
      .sidebar-top { margin: 0; }
      .sidebar nav { flex-direction: row; }
      .sidebar nav a { padding: .4rem .5rem; border-left: none; }
      .sidebar > .glide { display: none; }
      .fold { display: none; }
      .sidebar-bottom { flex-direction: row; align-items: center; margin: 0 0 0 auto; gap: .25rem; }
      .sidebar .live { padding: 0; }
      .folded .sidebar .label { position: static; width: auto; height: auto; clip: auto; }
      .folded .mark-spark { position: static; width: .8rem; height: .8rem; margin-left: -.3rem; }
      .folded .sidebar-top { flex-direction: row; }
      main { padding: 1.25rem 1rem 3rem; }
    }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden;
                       clip: rect(0 0 0 0); white-space: nowrap; }

    h1 { margin: 0 0 .25rem; font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; }
    h2 { margin: 0 0 .6rem; font-size: 1rem; font-weight: 500; }
    .lede { margin: 0 0 1.5rem; color: var(--muted); }
    .small { font-size: .8rem; }
    .live { display: flex; align-items: center; gap: .45rem;
            color: var(--muted); font: .7rem/1 var(--mono); letter-spacing: .08em;
            text-transform: uppercase; }

    /* The page heading row, with whatever action belongs to that page. */
    .page-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .page-head h1 { margin: 0; }
    .add { margin-left: auto; padding: .4rem .75rem; font: inherit; font-size: .9rem;
           color: var(--fg); background: var(--card); border: 1px solid var(--line);
           border-radius: .4rem; cursor: pointer; }
    .add:hover { border-color: var(--ember); color: var(--ember); }

    /* One of a few ways of reading something. Where the row has a highlight of its own
       (segmented.rs), that slides to the chosen one rather than each button drawing its own. */
    .switcher { position: relative; display: flex; border: 1px solid var(--line);
                border-radius: .4rem; overflow: hidden; }
    .switcher button { position: relative; z-index: 1; padding: .35rem .7rem; font: inherit;
                       font-size: .85rem; color: var(--muted); background: transparent;
                       border: none; cursor: pointer; transition: color var(--dur-fast); }
    .switcher button.chosen { color: var(--fg); background: var(--sunk); }
    .switcher button:hover { color: var(--fg); }
    .switcher > .glide { top: 0; bottom: 0; left: 0; background: var(--sunk); }
    .switcher:has(> .glide) button.chosen { background: transparent; }

    /* A row that folds open (fold.rs): a heading that is one button — chevron, icon, title,
       how it stands — with whatever acts on the row beside it, and a drawer underneath. */
    .fold-row { border-bottom: 1px solid var(--line); }
    .fold-row:last-child { border-bottom: none; }
    .fold-head { display: flex; align-items: center; }
    .fold-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: .6rem;
                   padding: .55rem .8rem; font: inherit; color: var(--fg); text-align: left;
                   background: transparent; border: none; cursor: pointer;
                   transition: background-color var(--dur-fast); }
    .fold-toggle:active { scale: 1; }
    .fold-toggle:focus-visible { outline: 2px solid var(--ember); outline-offset: -2px; }
    .fold-title { font-weight: 500; overflow-wrap: anywhere; }
    .fold-state { color: var(--muted); font: .72rem var(--mono); letter-spacing: .04em; }
    .fold-state .set { color: var(--ember); }
    .fold-actions { display: flex; align-items: center; gap: .25rem; padding-right: .6rem; }
    .chevron { flex: none; width: .5rem; height: .5rem; margin: 0 .2rem 0 .1rem;
               border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
               rotate: -45deg;
               transition: rotate var(--dur-base) var(--ease-spring),
                           translate var(--dur-base) var(--ease-out),
                           border-color var(--dur-fast); }
    .fold-row.open > .fold-head .chevron { rotate: 45deg; translate: 0 -.12rem; }
    .fold-toggle:hover .chevron { border-color: var(--ember); }

    /* The Devices and Entities lists (devices/tables.rs): groups that fold, and compact rows on
       one grid so every group's columns line up. A row sits further in than its group's name:
       the group is the heading, and what's under it reads as under it. */
    .list-bar { display: flex; align-items: center; gap: .6rem; margin: 0 0 .75rem; }
    .list-bar-label { color: var(--muted); font: .65rem var(--mono); letter-spacing: .08em;
                      text-transform: uppercase; }
    .list-bar .switcher button { padding: .25rem .65rem; font-size: .8rem; }
    .table-scroll { overflow-x: auto; margin-bottom: 1.5rem; border: 1px solid var(--line);
                    border-radius: .5rem; background: var(--card); }
    .grouped .fold-head { background: var(--sunk); }
    .grouped .fold-toggle:hover { background: var(--line); }
    .device-list .grouped-inner { min-width: 44rem; }
    .device-list { --cols: 1.25rem minmax(10rem, 2.2fr) minmax(5rem, 1.2fr) minmax(5rem, 1.2fr)
                           minmax(5rem, 1.4fr) 4.5rem 4.5rem; }
    .device-list.by-area, .device-list.by-make {
        --cols: 1.25rem minmax(10rem, 2.2fr) minmax(5rem, 1.2fr) minmax(5rem, 1.4fr)
                4.5rem 4.5rem; }
    /* No icon column here, so the row itself starts where a device's name would: further in
       than any group's name, icon or no icon. */
    .entity-list .line { padding-left: 5rem; }
    .entity-list { --cols: minmax(9rem, 1.3fr) minmax(5rem, .8fr) minmax(0, 1.5fr); }
    .entity-list.by-device { --cols: minmax(9rem, 1fr) minmax(0, 1.3fr); }
    /* A player's buttons are the widest thing a row holds: its controls take the width they
       need to stay on one line, and the name keeps what's left. */
    .entity-list .line:has(.media-reading) { --cols: minmax(9rem, 1fr) minmax(0, .5fr) auto; }
    .entity-list.by-device .line:has(.media-reading) { --cols: minmax(9rem, 1fr) auto; }
    .entity-line .media-reading { max-width: 7rem; }
    .entity-line .volume-group input[type="range"] { width: 5.5rem; }
    .line { display: grid; grid-template-columns: var(--cols); align-items: center;
            column-gap: 1rem; padding: .45rem .8rem .45rem 2.75rem; font-size: .9rem;
            border-bottom: 1px solid var(--line); }
    .line.columns { padding-top: .5rem; padding-bottom: .5rem; color: var(--muted);
                    font: .65rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .lines { border-top: 1px solid var(--line); }
    .lines > .line:last-child { border-bottom: none; }
    .device-line { transition: background-color var(--dur-fast); }
    .device-line:hover { background: var(--sunk); }
    .cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell.icon-col { overflow: visible; line-height: 0; }
    .cell.name-col { font-weight: 500; }
    .cell.name-col a { transition: color var(--dur-fast); }
    .cell.name-col a:hover { color: var(--ember); }
    .cell.name-col .description { display: block; overflow: hidden; text-overflow: ellipsis;
                                  color: var(--muted); font-size: .8rem; font-weight: 400; }
    .cell.room { color: var(--muted); }
    .cell.number, .cell.battery { font-variant-numeric: tabular-nums; text-align: right; }
    /* An entity: its row, and the drawer its last 24 hours rolls down in. */
    .entity-block { border-bottom: 1px solid var(--line); }
    .entity-block:last-child { border-bottom: none; }
    .entity-block > .line { border-bottom: none; }
    .entity-line .of-device { color: var(--muted); }
    .entity-line .control { display: flex; flex-wrap: wrap; align-items: center;
                            justify-content: flex-end; gap: .25rem 1rem; overflow: visible;
                            white-space: normal; }
    .entity-line .control .light-controls { order: 2; justify-content: flex-end; }
    .entity-line .control .why { order: 3; text-align: right; }
    .entity-line.offline .name, .entity-line.offline .reading,
    .entity-line.offline .reading.on { color: var(--muted); }
    .entity-block > .drawer { background: var(--bg); }
    @media (max-width: 720px) {
      .entity-list .line { grid-template-columns: 1fr; row-gap: .3rem; padding-left: 4.4rem; }
      .entity-line .of-device { display: none; }
      .entity-line .control { justify-content: flex-start; }
    }
    /* Regrouping (tables.rs): each row that is on show travels from where it was to where it
       now belongs, and the headings change behind them. Rows in a folded group stay put —
       pictured, they would fly out of a group that isn't showing them. */
    html[data-nav="regroup"]::view-transition-old(page),
    html[data-nav="place"]::view-transition-old(page) { animation: none; display: none; }
    html[data-nav="regroup"]::view-transition-new(page),
    html[data-nav="place"]::view-transition-new(page) { animation: none; }
    html[data-nav="regroup"] .fold-row.open .device-line,
    html[data-nav="regroup"] .fold-row.open .entity-block { view-transition-name: var(--vt); }

    .crumb { margin: 0 0 .5rem; font-size: .85rem; }
    .crumb a { color: var(--muted); text-decoration: none; }
    .crumb a:hover { color: var(--ember); }

    .card { margin-bottom: 1.5rem; padding: 1rem 1.25rem; border: 1px solid var(--line);
            border-radius: .5rem; background: var(--card); }
    .card dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.25rem;
               margin: 0; }
    .card dt { color: var(--muted); font: .7rem/1.8 var(--mono); letter-spacing: .08em;
               text-transform: uppercase; }
    .card dd { margin: 0; font-family: var(--mono); font-size: .85rem;
               overflow-wrap: anywhere; }

    /* Counts, big enough to read from across the room. */
    .tiles { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.5rem; }
    .tiles .tile { flex: 1 1 8rem; padding: .9rem 1rem; border: 1px solid var(--line);
                   border-radius: .5rem; background: var(--card); text-decoration: none;
                   color: inherit; display: block; }
    .tiles a.tile:hover { border-color: var(--ember); transform: translateY(-2px);
                          box-shadow: 0 .4rem 1rem rgba(28, 23, 20, .08); }
    .tiles a.tile:active { transform: translateY(0); box-shadow: none; }
    /* On arrival, the counts come in one after another. Only once: the tiles are fixed markup
       and only the numbers inside them are live, so a new reading doesn't play this again. */
    .tiles .tile { animation: rise var(--dur-base) var(--ease-out) backwards;
                   animation-delay: calc(var(--i, 0) * 60ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    .tiles .count { display: block; font-size: 1.75rem; font-weight: 500;
                    font-variant-numeric: tabular-nums; }
    .tiles .label { display: block; color: var(--muted); font-size: .8rem; }

    /* Extensions, on the home page and in the add-device panel. */
    .extensions, .protocols { margin: 0; padding: 0; list-style: none; }
    .extensions li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem;
                     padding: .4rem 0; border-bottom: 1px solid var(--line); }
    .extensions li:last-child { border-bottom: none; }
    .protocols li { padding: .75rem 0; border-bottom: 1px solid var(--line); }
    .protocols li:last-child { border-bottom: none; }
    .protocol-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem; }
    .protocols p { margin: .25rem 0 0; }
    /* Each protocol row is a button (so it's clickable/keyboard-focusable), reset to look like
       the plain row it used to be. */
    .protocol-picker { display: block; width: 100%; padding: 0; font: inherit; color: inherit;
                        text-align: left; background: none; border: none; cursor: pointer; }
    .protocol-detail { margin-top: .6rem; padding-top: .6rem; border-top: 1px dashed var(--line); }
    .protocol-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
    .name { font-weight: 500; }
    .state { color: var(--muted); font: .7rem var(--mono); letter-spacing: .08em;
             text-transform: uppercase; }
    .state.ok { color: var(--ember); }
    button.danger { padding: .4rem .75rem; font: inherit; font-size: .9rem;
                    color: var(--ember); background: var(--card); border: 1px solid var(--line);
                    border-radius: .4rem; cursor: pointer; }
    button.danger:hover { border-color: var(--ember); }
    button:disabled { opacity: .55; cursor: default; }

    /* Every button eases into its hover colours rather than snapping, and gives a little under
       a press. `:where` keeps these at no specificity, so each button's own rules still win.
       Left out: the toggle, which has a press of its own, and the Floorplan's device markers,
       which are placed by their transform. */
    :where(button:not(.toggle, .marker), .add, a.tile, a.quiet-button) {
        transition: color var(--dur-fast), background-color var(--dur-fast),
                    border-color var(--dur-fast), box-shadow var(--dur-base) var(--ease-out),
                    transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast); }
    :where(button:not(.toggle, .marker, :disabled), a.quiet-button):active { transform: scale(.97); }

    /* Extensions page: search, quick filters, and a grid of cards. */
    .ext-controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
                    margin-bottom: 1.25rem; }
    .ext-search { flex: 1 1 14rem; padding: .5rem .7rem; font: inherit; color: var(--fg);
                  background: var(--card); border: 1px solid var(--line); border-radius: .4rem; }
    .ext-search:focus { outline: 2px solid var(--ember); outline-offset: -1px; }
    .ext-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .ext-chips button { padding: .3rem .8rem; font: inherit; font-size: .8rem; color: var(--muted);
                         background: var(--card); border: 1px solid var(--line);
                         border-radius: 1rem; cursor: pointer; }
    .ext-chips button:hover { color: var(--fg); border-color: var(--fg); }
    .ext-chips button.active { color: var(--ember); border-color: var(--ember); }

    .ext-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
                gap: 1rem; }
    /* Every card the same height, whatever its extension has to say: two lines of what it's
       for, and the rest behind "Show more". */
    .ext-card { position: relative; display: flex; flex-direction: column; gap: .45rem;
                height: 14.75rem; padding: 1rem 1.1rem; border: 1px solid var(--line);
                border-radius: .6rem; background: var(--card);
                transition: border-color var(--dur-fast), translate var(--dur-base) var(--ease-out); }
    .ext-card:hover { border-color: var(--muted); translate: 0 -2px; }
    .ext-standing { display: flex; align-items: center; gap: .5rem; min-height: 1.2rem; }
    .ext-more-button { align-self: flex-start; }
    .ext-more { display: grid; gap: .7rem; }
    .ext-more p { margin: 0; }
    .ext-category { position: absolute; top: .8rem; right: .85rem; color: var(--muted);
                     font: .62rem var(--mono); letter-spacing: .08em; text-transform: uppercase;
                     background: var(--sunk); padding: .15rem .55rem; border-radius: 1rem; }
    .ext-card-head { display: flex; align-items: center; gap: .6rem; padding-right: 4.5rem; }
    .ext-card-title { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
    .ext-card > * { flex: none; }
    .ext-description { margin: 0; font-size: .85rem; display: -webkit-box; overflow: hidden;
                       -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
    .ext-more .ext-description { display: block; }
    .ext-access { margin: 0; color: var(--ember); font-size: .8rem; }
    .ext-actions { display: flex; gap: .5rem; margin-top: auto; padding-top: .3rem; }
    .ext-actions .add, .ext-actions .danger { flex: 1 1 auto; width: auto; margin-left: 0; }

    /* An indeterminate sweep while an install or uninstall is in flight: there's no real byte
       progress to show (a `cargo build` or a GitHub download report nothing in between), so this
       says "working on it" rather than pretending to measure something we can't. */
    .ext-btn { position: relative; overflow: hidden; }
    .ext-btn .label { position: relative; z-index: 1; }
    .ext-btn .bar { position: absolute; inset: 0;
                    background: linear-gradient(90deg, rgba(196, 85, 43, 0),
                        rgba(196, 85, 43, .32), rgba(196, 85, 43, 0));
                    background-size: 60% 100%; background-repeat: no-repeat;
                    animation: ext-progress 1.1s ease-in-out infinite; }
    @keyframes ext-progress {
        0% { background-position: -60% 0; }
        100% { background-position: 160% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
        .ext-btn .bar { animation: none; background: rgba(196, 85, 43, .18); }
    }
    .dot { width: .5rem; height: .5rem; border-radius: 2px; background: var(--muted); }
    .dot.ok { background: var(--ember); box-shadow: 0 0 .4rem var(--ember);
              animation: breathe 2.4s ease-in-out infinite; }
    /* Live: the dot breathes while the core keeps answering, and goes still when it doesn't —
       stillness here is itself the news. */
    @keyframes breathe { 50% { box-shadow: 0 0 .15rem var(--ember); } }

    /* The gear icon (settings) and the form it opens, generated from an extension's own schema.
       Sits beside the install/uninstall button rather than in the top-right corner, which the
       category badge already occupies. */
    .ext-settings-btn { flex: 0 0 auto; width: 2.1rem; padding: 0; font-size: 1rem; line-height: 1;
                         color: var(--muted); background: var(--card); border: 1px solid var(--line);
                         border-radius: .4rem; cursor: pointer; }
    .ext-settings-btn:hover { color: var(--ember); border-color: var(--ember); }
    .ext-settings-btn { position: relative; display: inline-grid; place-items: center;
                        transition: color var(--dur-fast), border-color var(--dur-fast); }
    .ext-settings-btn .icon { width: 1.05rem; height: 1.05rem; }
    .ext-settings-btn:hover .icon { rotate: 20deg; }
    .ext-settings-btn .icon { transition: rotate var(--dur-base) var(--ease-spring); }
    .ext-log-btn:hover .icon { rotate: 0deg; translate: 0 -1px; }
    /* Something in the log is worth reading: a small mark on the way to it. */
    .ext-mark { position: absolute; top: -.4rem; right: -.4rem; display: grid; place-items: center;
                width: 1.05rem; height: 1.05rem; border-radius: 50%; color: #fff;
                background: var(--error); font: 700 .7rem/1 var(--sans);
                box-shadow: 0 0 0 2px var(--card); }
    .ext-log-btn.troubled { color: var(--error); border-color: var(--error); }
    .settings-form { display: flex; flex-direction: column; gap: .6rem; margin-top: .6rem;
                     padding-top: .6rem; border-top: 1px dashed var(--line); }
    .settings-field { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; }
    .settings-field input { padding: .4rem .6rem; font: inherit; font-size: .95rem;
                            color: var(--fg); background: var(--bg); border: 1px solid var(--line);
                            border-radius: .4rem; }
    .settings-field input:focus { outline: 2px solid var(--ember); outline-offset: -1px; }
    .settings-field-checkbox { flex-direction: row; align-items: center; gap: .5rem; }
    .settings-field-checkbox input { width: auto; }
    .settings-form-actions { display: flex; gap: .5rem; justify-content: flex-end; }
    .settings-form-actions button { padding: .35rem .7rem; font: inherit; font-size: .85rem;
                                    color: var(--fg); background: var(--card);
                                    border: 1px solid var(--line); border-radius: .4rem;
                                    cursor: pointer; }
    .settings-form-actions button:hover { border-color: var(--ember); color: var(--ember); }
    .settings-form-actions .add { background: var(--ember); border-color: var(--ember);
                                  color: var(--card); }
    .settings-form-actions .add:hover { background: #ab4717; border-color: #ab4717; }

    .filter { width: 100%; margin-bottom: 1.5rem; padding: .5rem .7rem; font: inherit;
              color: var(--fg); background: var(--card); border: 1px solid var(--line);
              border-radius: .4rem; }
    .filter:focus { outline: 2px solid var(--ember); outline-offset: -1px; }

    .banner { margin: 0 0 1.25rem; padding: .6rem .8rem; border: 1px solid var(--ember);
              border-radius: .4rem; color: var(--ember); font-size: .875rem;
              animation: drop-in var(--dur-base) var(--ease-out) backwards; }
    /* Once, when something goes wrong: a banner stays put while the trouble does, and a new
       reason only changes its words. */
    @keyframes drop-in { from { opacity: 0; transform: translateY(-4px); } }

    .entity { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem 1rem;
              padding: .7rem 1rem; border-bottom: 1px solid var(--line); }
    .entity:last-child { border-bottom: none; }
    /* Offline: the whole row recedes, last known reading included, so a stale value can't read
       as a live one. The switch is disabled separately. */
    .entity.offline .name, .entity.offline .reading, .entity.offline .reading.on { color: var(--muted); }
    .names { min-width: 0; flex: 1; }
    /* An entity's own icon (icons.rs), to the left of its name: what kind of thing it is. Quiet,
       so the name is still what's read first. */
    .entity-icon { flex: none; width: 1.15rem; height: 1.15rem; color: var(--muted); }
    .entity > .entity-icon { margin-right: -.35rem; }
    .cell.names.iconed { display: flex; align-items: center; gap: .65rem; }
    .names-text { min-width: 0; flex: 1; }
    .names-text .name { overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; }
    .name { display: block; overflow-wrap: anywhere; }
    /* Ids are long and the name above already says which entity this is: one line, cut off
       rather than broken across lines on a phone. The full id is in the element's title. */
    .id { display: block; color: var(--muted); font: .7rem var(--mono);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reading { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .reading .unit { color: var(--muted); }
    .reading.on { color: var(--ember); }
    /* A number that just changed (count.rs) counts to its new value, lit in ember as it goes and
       rising into place if it went up, dropping into place if it went down. */
    .n { display: inline-block; }
    [data-moved="up-a"] { animation: rose-a 700ms var(--ease-out); }
    [data-moved="up-b"] { animation: rose-b 700ms var(--ease-out); }
    [data-moved="down-a"] { animation: fell-a 700ms var(--ease-out); }
    [data-moved="down-b"] { animation: fell-b 700ms var(--ease-out); }
    @keyframes rose-a { from { color: var(--ember); translate: 0 .3em; } }
    @keyframes rose-b { from { color: var(--ember); translate: 0 .3em; } }
    @keyframes fell-a { from { color: var(--ember); translate: 0 -.3em; } }
    @keyframes fell-b { from { color: var(--ember); translate: 0 -.3em; } }
    .badge { color: var(--muted); font: .65rem var(--mono); letter-spacing: .08em;
             text-transform: uppercase; }
    /* Why the last command was refused, on its own line under the row it belongs to. */
    .why { flex-basis: 100%; margin: .15rem 0 0; color: var(--ember); font-size: .8rem; }

    /* The toggle: a switch that shows what the entity is doing, not what was clicked. */
    .toggle { flex: none; width: 3.1rem; height: 1.75rem; padding: .18rem; cursor: pointer;
              background: var(--sunk); border: 1px solid var(--line); border-radius: 1rem;
              display: flex; justify-content: flex-start;
              transition: background-color var(--dur-base) var(--ease-out),
                          border-color var(--dur-base) var(--ease-out), opacity var(--dur-fast); }
    /* The knob springs across, a touch past where it lands and back. */
    .toggle .knob { width: 1.3rem; height: 1.3rem; border-radius: .65rem; background: var(--card);
                    border: 1px solid var(--line);
                    transition: transform var(--dur-base) var(--ease-spring),
                                width var(--dur-fast) var(--ease-out),
                                border-color var(--dur-base); }
    .toggle[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); }
    .toggle[aria-pressed="true"] .knob { transform: translateX(1.35rem); border-color: transparent; }
    .toggle:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
    .toggle:disabled { cursor: default; opacity: .5; }
    .toggle.unknown .knob { transform: translateX(.67rem); }
    /* Held down, the knob stretches toward where it's about to go, keeping the edge it leaves
       from where it was: the press is felt before the device has answered. */
    .toggle:active:not(:disabled) .knob { width: 1.6rem; }
    .toggle[aria-pressed="true"]:active:not(:disabled) .knob { transform: translateX(1.05rem); }
    .toggle.unknown:active:not(:disabled) .knob { transform: translateX(.52rem); }
    /* Asked, and waiting for the device to say it's done: the knob breathes, so a slow device
       reads as busy rather than broken. Offline stays plain and dim — nothing is coming. */
    /* Swiped (gesture.rs): the knob is under the finger, so nothing eases it; let go, and it
       springs home from there. A horizontal swipe on a phone is the toggle's, not the page's. */
    .toggle { touch-action: pan-y; }
    .toggle[data-dragging] .knob { transition: width var(--dur-fast) var(--ease-out); }
    .toggle.pending { cursor: progress; opacity: .8; }
    .toggle.pending .knob { animation: knob-wait .9s ease-in-out infinite alternate; }
    @keyframes knob-wait { to { scale: .78; } }

    /* A lit light's level and color, on its own line under the row: one slider per thing the
       light can set. The value a slider shows is the device's, not the last thing asked for. */
    .light-controls { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center;
                      gap: .3rem .9rem; padding: .2rem .1rem 0; }
    /* A short list of choices, and the one-shot buttons beside a cover. The same bordered
       button as the rest of the page: the chosen choice is sunk, with an ember edge. */
    .choices { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .35rem;
               max-width: 100%; }
    .choices button, button.press {
        padding: .25rem .65rem; font: inherit; font-size: .8rem; color: var(--muted);
        background: var(--card); border: 1px solid var(--line); border-radius: .4rem;
        cursor: pointer;
        transition: color var(--dur-fast), background-color var(--dur-base) var(--ease-out),
                    border-color var(--dur-fast), transform var(--dur-fast) var(--ease-out); }
    .choices button:hover:not(:disabled), button.press:hover:not(:disabled) {
        color: var(--fg); border-color: var(--ember); }
    .choices button[aria-pressed="true"] {
        color: var(--fg); background: var(--sunk); border-color: var(--ember); }
    .choices button:focus-visible, button.press:focus-visible {
        outline: 2px solid var(--ember); outline-offset: 2px; }
    .text-control { width: 12rem; padding: .2rem .5rem; font-size: .85rem; }
    .cover-buttons { display: inline-flex; flex-wrap: wrap; align-items: center; }
    /* A button that is only there while it makes sense (controls `tuck`): it folds away to
       nothing and what's beside it closes up, rather than a row of buttons that don't apply. */
    .tuck { display: inline-grid; grid-template-columns: 0fr; opacity: 0; margin-left: 0;
            transition: grid-template-columns var(--dur-base) var(--ease-out),
                        margin var(--dur-base) var(--ease-out), opacity var(--dur-fast); }
    .tuck.in { grid-template-columns: 1fr; opacity: 1; margin-left: .35rem; }
    .tuck-inner { min-width: 0; overflow: hidden; display: flex; }
    .tuck.in .tuck-inner { overflow: visible; }
    /* A button that is an icon; where it means two things by turns, one drawing turns into
       the other. */
    button.press.glyph { position: relative; display: inline-grid; place-items: center;
                         width: 2rem; height: 1.9rem; padding: 0; }
    .glyph .icon { width: 1rem; height: 1rem; }
    .glyph-first, .glyph-second { grid-area: 1 / 1;
        transition: opacity var(--dur-fast), scale var(--dur-base) var(--ease-spring),
                    rotate var(--dur-base) var(--ease-out); }
    .glyph-second { opacity: 0; scale: .4; rotate: -90deg; }
    .glyph.alt .glyph-first { opacity: 0; scale: .4; rotate: 90deg; }
    .glyph.alt .glyph-second { opacity: 1; scale: 1; rotate: 0deg; }
    /* A player's volume: mute, the slider and the level, framed as one button. */
    .volume-group { display: inline-flex; align-items: center; gap: .35rem; height: 1.9rem;
                    padding-right: .5rem; background: var(--card); border: 1px solid var(--line);
                    border-radius: .4rem; transition: border-color var(--dur-fast); }
    .volume-group:hover { border-color: var(--ember); }
    .volume-group > :not(.glyph):first-child { margin-left: .6rem; }
    .volume-group > .glyph:last-child { margin-right: -.5rem; }
    .volume-group button.press.glyph { height: 100%; border: none; background: transparent; }
    .volume-group input[type="range"] { width: 7rem; min-width: 5rem; }
    .volume-group input:disabled { cursor: progress; opacity: .5; }
    /* Firefox fills its track from the slider's value, not `--fill`: muted, it's emptied here. */
    .volume-group.muted input[type="range"]::-moz-range-progress { background: transparent; }
    .volume-group .lv { min-width: 2.6rem; text-align: right; color: var(--muted);
                        font: .72rem var(--mono); font-variant-numeric: tabular-nums; }
    /* What's playing gives way before the name or the buttons do: a long title is cut short,
       and is whole in the element's title. */
    .media-reading { flex: 0 1 auto; min-width: 0; max-width: 10rem; overflow: hidden;
                     text-overflow: ellipsis; }
    .entity:has(> .media-reading) .names { min-width: 5rem; }
    /* Sending a player a link: a button, and the small form that drops from it. The form is
       pinned to the window where the page measured the button to be, so that a list that
       clips its rows can't clip it. */
    .cast { position: relative; display: inline-flex; }
    .cast > button[aria-expanded="true"] { color: var(--fg); background: var(--sunk);
                                           border-color: var(--ember); }
    .cast-pop { position: fixed; z-index: 20;
                display: flex; flex-direction: column; gap: .5rem; width: min(24rem, 90vw);
                padding: .75rem; text-align: left; background: var(--card);
                border: 1px solid var(--line); border-radius: .5rem;
                box-shadow: 0 .6rem 1.6rem rgba(28, 23, 20, .16);
                animation: cast-in var(--dur-fast) var(--ease-out); }
    @keyframes cast-in { from { opacity: 0; translate: 0 4px; } }
    .cast-title { font-size: .8rem; font-weight: 600; color: var(--muted); }
    .cast-row { display: flex; gap: .5rem; }
    .cast-row input { flex: 1; min-width: 0; padding: .35rem .5rem; font-size: .85rem; }
    .cast-row button { padding: .35rem .7rem; font: inherit; font-size: .85rem;
                       color: var(--card); background: var(--ember);
                       border: 1px solid var(--ember); border-radius: .4rem; cursor: pointer; }
    .cast-row button:hover:not(:disabled) { background: #ab4717; border-color: #ab4717; }
    .cast-row button:disabled { cursor: progress; opacity: .5; }
    /* A lock's padlock: the shackle lifts when it's unlocked and drops when it locks, works
       up and down while the bolt is moving, and shakes once when it jams. */
    .lock-reading { display: inline-flex; align-items: center; gap: .35rem; }
    .padlock { width: 1.05rem; height: 1.05rem; flex: none; overflow: visible; }
    .padlock .shackle { transform-box: fill-box; transform-origin: 100% 100%;
                        transition: translate var(--dur-base) var(--ease-spring),
                                    rotate var(--dur-layout) var(--ease-spring); }
    .padlock[data-lock="open"] .shackle { translate: 0 -2.5px; rotate: 28deg; }
    .padlock[data-lock="moving"] .shackle { animation: bolt 900ms ease-in-out infinite; }
    .padlock[data-lock="stuck"] { color: var(--error); animation: shake 360ms var(--ease-out); }
    @keyframes bolt { 50% { translate: 0 -2.5px; } }
    .reading.moving { color: var(--ember); }
    .lock-code { display: flex; flex-direction: column; gap: .3rem; margin: .8rem 0; }
    .fan-swing { display: inline-flex; align-items: center; gap: .35rem; }
    /* A thermostat's target, typed in, and what the room is now. */
    .climate-target { display: inline-flex; align-items: center; gap: .3rem; color: var(--muted); }
    .climate-target input { width: 3.4rem; padding: .2rem .4rem; text-align: right; }
    .climate-now { color: var(--muted); font: .72rem var(--mono); }
    /* A number typed in rather than dragged: a short box and its unit. */
    .number-box { display: inline-flex; align-items: center; gap: .35rem; }
    .number-box input { width: 4.6rem; padding: .2rem .4rem; text-align: right; }
    .number-box .unit { color: var(--muted); font-size: .9rem; }
    .light-controls .dim { display: inline-flex; align-items: center; gap: .45rem;
                           font: .72rem var(--mono); color: var(--muted); }
    .light-controls .lv { min-width: 2.6rem; text-align: right; font-variant-numeric: tabular-nums; }
    /* Every slider is drawn here rather than left to the browser, so the track can say what the
       slider means: the value filled in ember up to the thumb, or color temperature as the
       colors themselves. The thumb swells under the pointer and more while held. `--fill` is set
       from the page as the thumb moves. */
    .light-controls input[type="range"] { width: 7rem; }
    input[type="range"] {
        height: 1.1rem; margin: 0; padding: 0; background: transparent;
        -webkit-appearance: none; appearance: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track {
        height: 4px; border-radius: 2px;
        background: linear-gradient(to right, var(--ember) var(--fill, 0%),
                                    var(--line) var(--fill, 0%)); }
    input[type="range"]::-moz-range-track {
        height: 4px; border-radius: 2px; background: var(--line); }
    input[type="range"]::-moz-range-progress {
        height: 4px; border-radius: 2px; background: var(--ember); }
    input[type="range"].kelvin::-webkit-slider-runnable-track {
        background: linear-gradient(to right, #f5a54a, #fbe3c4, #e9f1ff); }
    input[type="range"].kelvin::-moz-range-track {
        background: linear-gradient(to right, #f5a54a, #fbe3c4, #e9f1ff); }
    input[type="range"].kelvin::-moz-range-progress { background: transparent; }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -5px;
        border-radius: 50%; background: var(--card); border: 2px solid var(--ember);
        box-shadow: 0 1px 2px rgba(28, 23, 20, .2);
        transition: transform var(--dur-base) var(--ease-bounce),
                    box-shadow var(--dur-fast) var(--ease-out); }
    input[type="range"]::-moz-range-thumb {
        box-sizing: border-box; width: 14px; height: 14px; border-radius: 50%;
        background: var(--card); border: 2px solid var(--ember);
        box-shadow: 0 1px 2px rgba(28, 23, 20, .2);
        transition: transform var(--dur-base) var(--ease-bounce),
                    box-shadow var(--dur-fast) var(--ease-out); }
    input[type="range"]:hover:not(:disabled)::-webkit-slider-thumb {
        transform: scale(1.15); }
    input[type="range"]:hover:not(:disabled)::-moz-range-thumb {
        transform: scale(1.15); }
    input[type="range"]:active:not(:disabled)::-webkit-slider-thumb {
        transform: scale(1.4); box-shadow: 0 0 0 5px rgba(196, 85, 43, .18); }
    input[type="range"]:active:not(:disabled)::-moz-range-thumb {
        transform: scale(1.4); box-shadow: 0 0 0 5px rgba(196, 85, 43, .18); }
    input[type="range"]:focus { outline: none; }
    input[type="range"]:focus-visible::-webkit-slider-thumb {
        box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ember); }
    input[type="range"]:focus-visible::-moz-range-thumb {
        box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ember); }
    .light-controls input[type="color"] { width: 2.1rem; height: 1.55rem; padding: 0 .1rem;
                                          border: 1px solid var(--line); border-radius: .4rem;
                                          background: var(--card); cursor: pointer; }
    .light-controls input:disabled { cursor: progress; opacity: .5; }

    /* Rooms: the part of the home a person arranged themselves. */
    .rooms { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
             margin: .25rem 0 .75rem; }
    .room-card { padding: .7rem .85rem; border: 1px solid var(--line); border-radius: .5rem;
                 background: var(--bg); }
    .room-floor { display: block; color: var(--muted); font: .65rem var(--mono); letter-spacing: .08em;
                  text-transform: uppercase; }
    .room-card h3 { margin: 0 0 .4rem; font-size: .95rem; font-weight: 500; }
    /* A device's settings and diagnostics, after what it's for. */
    .entity-group { margin: 1.1rem 0 .3rem; font-size: .8rem; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .room-card ul { margin: 0; padding: 0; list-style: none; font-size: .875rem; }
    .room-card li { padding: .1rem 0; overflow-wrap: anywhere; }
    .room-card a { color: inherit; text-decoration: none; }
    .room-card a:hover { color: var(--ember); }

    .room-actions { margin-left: auto; display: flex; gap: .5rem; }
    .room-devices { margin: 0; padding: 0; list-style: none; }
    .room-devices li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem;
                       padding: .35rem 0; border-bottom: 1px solid var(--line); }
    .room-devices li:last-child { border-bottom: none; }

    /* Renaming, and choosing a room: small forms that sit inside a heading or a card. */
    .inline-form { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    .inline-form input { padding: .4rem .6rem; font: inherit; font-size: .95rem;
                         color: var(--fg); background: var(--bg); border: 1px solid var(--line);
                         border-radius: .4rem; }
    .inline-form input:focus { outline: 2px solid var(--ember); outline-offset: -1px; }
    .inline-form button, .room-actions button:not(.toggle) {
        padding: .35rem .7rem; font: inherit; font-size: .85rem; color: var(--fg);
        background: var(--card); border: 1px solid var(--line); border-radius: .4rem;
        cursor: pointer; }
    .inline-form button:hover, .room-actions button:not(.toggle):hover {
        border-color: var(--ember); color: var(--ember); }
    .room-actions .danger:hover { border-color: #b4342c; color: #b4342c; }

    /* Picking several found devices at once: a checkbox lining up with a row, and the
       select-all box that feeds the "Add/Ignore selected" buttons. */
    .pick { display: flex; align-items: center; align-self: center; }
    .pick input, .pick-all input { width: 1rem; height: 1rem; margin: 0;
                                   accent-color: var(--ember); cursor: pointer; }
    .page-head > button { padding: .35rem .7rem; font: inherit; font-size: .85rem;
                          color: var(--muted); background: transparent;
                          border: 1px solid var(--line); border-radius: .4rem; cursor: pointer; }
    .page-head > button:hover { border-color: var(--ember); color: var(--ember); }
    .page-actions { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
    .page-actions button { padding: .35rem .7rem; font: inherit; font-size: .85rem;
                           color: var(--muted); background: transparent;
                           border: 1px solid var(--line); border-radius: .4rem; cursor: pointer; }
    .page-actions button:hover { border-color: var(--ember); color: var(--ember); }

    /* A name that goes somewhere, in the colour of the text around it. Ember is the hover,
       the way the device table does it, rather than a link that is ember all the time. */
    a.row-link { color: inherit; text-decoration: none; transition: color var(--dur-fast); }
    a.row-link:hover { color: var(--ember); }

    /* A device's entity, with the name it can be given underneath its reading. */
    .entity-row { border-bottom: 1px solid var(--line); }
    .entity-row:last-child { border-bottom: none; }
    .entity-row .entity { border-bottom: none; }
    /* Text that is changed where it stands (inline.rs): a pencil beside it, quiet until the
       row is pointed at, and a field in the same place with its own tick and cross. */
    .editable { display: inline-flex; align-items: center; gap: .3rem; max-width: 100%;
                min-width: 0; }
    .names .editable { display: flex; }
    .pencil { opacity: .35; transition: opacity var(--dur-fast), color var(--dur-fast),
                                       border-color var(--dur-fast); }
    .pencil .icon { width: .85rem; height: .85rem; }
    .editable:hover .pencil, .pencil:hover, .pencil:focus-visible,
    .area-field:hover .pencil { opacity: 1; }
    .inline-edit { display: inline-flex; align-items: center; gap: .25rem; min-width: 0;
                   animation: rise var(--dur-base) var(--ease-out) backwards; }
    .inline-edit input { min-width: 0; width: min(22rem, 60vw); padding: .15rem .45rem;
                         font: inherit; letter-spacing: inherit; color: var(--fg);
                         background: var(--bg); border: 1px solid var(--line);
                         border-radius: .4rem; }
    .inline-edit input:focus { outline: 2px solid var(--ember); outline-offset: -1px; }
    .names .inline-edit input { width: min(16rem, 50vw); }
    .icon-button.save { color: var(--ember); }
    .icon-button.save:hover { color: var(--card); background: var(--ember);
                              border-color: var(--ember); }
    h1 .icon-button, .description-lede .icon-button { vertical-align: middle; }
    .description-lede .editable { display: flex; }
    .description-lede .inline-edit, .description-lede .inline-edit input { flex: 1; width: auto; }
    .area-field { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    /* The way into an entity's last 24 hours, where the eye already is: on the device page a
       sensor's reading is itself the button, and a switch or light has a chevron beside its
       control. The chevron turns as the drawer rolls down. */
    .unroll { display: inline-flex; align-items: center; gap: .4rem; padding: .2rem .45rem;
              margin: -.2rem -.45rem -.2rem 0; font: inherit; color: inherit; cursor: pointer;
              background: transparent; border: 1px solid transparent; border-radius: .4rem; }
    .unroll:hover, .unroll.open { border-color: var(--line); background: var(--sunk); }
    /* Pulled (gesture.rs): it gives a little under the finger and bounces back when let go. A
       vertical pull here is the drawer's, not the page's. */
    .unroll { touch-action: pan-x;
              transition: translate var(--dur-base) var(--ease-bounce),
                          border-color var(--dur-fast), background-color var(--dur-fast); }
    .unroll[data-y0] { transition: none; }
    .unroll:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
    .unroll-mark { width: .45rem; height: .45rem; margin: -.15rem .1rem 0;
                   border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
                   rotate: 45deg; transition: rotate var(--dur-base) var(--ease-spring),
                                              margin var(--dur-base) var(--ease-out); }
    .unroll.open .unroll-mark { rotate: 225deg; margin-top: .25rem; }
    .unroll:hover .unroll-mark { border-color: var(--ember); }
    /* A light's sliders take their own line: the chevron stays up by the switch. */
    .entity .light-controls { order: 2; }
    .entity .why { order: 3; }

    /* The drawer the history rolls down in. Rows of a grid from nothing to its content's
       height, so it opens to exactly what's inside, and closes as smoothly as it opens. */
    .drawer { display: grid; grid-template-rows: 0fr;
              transition: grid-template-rows var(--dur-layout) var(--ease-out); }
    .drawer.open { grid-template-rows: 1fr; }
    .drawer-inner { min-height: 0; overflow: hidden; opacity: 0; translate: 0 -6px;
                    transition: opacity var(--dur-base) var(--ease-out),
                                translate var(--dur-layout) var(--ease-out); }
    .drawer.open .drawer-inner { opacity: 1; translate: 0 0; }
    .history-head { display: flex; justify-content: flex-end; padding: .5rem .75rem 0; }
    .history-head .switcher button { padding: .2rem .6rem; font-size: .75rem; }

    /* A number's day. The line draws itself in from the left once, when the day arrives (it's
       the one thing here allowed to take longer: it's the data arriving, not the page moving);
       the area settles in behind it, and now's dot lands and rings once. Pointing, or the
       arrow keys, put a rule, a dot and the reading at that moment over it. */
    .chart { margin: 0; padding: .6rem .75rem .5rem; }
    .chart-plot { position: relative; height: 9.5rem; margin: .6rem 3.4rem .2rem 0;
                  cursor: crosshair; touch-action: pan-y; border-radius: .25rem; }
    .chart-plot:focus { outline: none; }
    /* Written out as markup (chart.rs); these wrappers stay out of the layout, so what's in them
       is placed against the plot itself. */
    .chart-layer { display: contents; }
    .chart-plot:focus-visible { outline: 2px solid var(--ember); outline-offset: 4px; }
    .chart-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    /* The day arriving draws itself in, once (chart.rs marks that drawing `arriving`). After
       that the day grows a reading at a time: the line simply runs on, and the end rings. */
    .chart-plot svg.arriving { animation: chart-draw 560ms var(--ease-out) both; }
    @keyframes chart-draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
    .chart-grid line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .chart-line { fill: none; stroke: var(--ember); stroke-width: 2; stroke-linejoin: round;
                  stroke-linecap: round; }
    .chart-area { fill: var(--ember); opacity: .12; }
    .arriving .chart-area { animation: settle 400ms var(--ease-out) 200ms backwards; }
    @keyframes settle { from { opacity: 0; } }
    .chart-tick { position: absolute; left: 0; translate: 0 -120%; color: var(--muted);
                  font: .65rem var(--mono); font-variant-numeric: tabular-nums; }
    .chart-tick.top { top: 8%; }
    .chart-tick.bottom { top: 92%; }
    .chart-end, .chart-dot { position: absolute; width: .6rem; height: .6rem;
                             translate: -50% -50%; border-radius: 50%;
                             background: var(--ember); box-shadow: 0 0 0 2px var(--card); }
    .chart-end { left: 100%; }
    .chart-end.arriving { animation: pop var(--dur-base) var(--ease-spring) 480ms backwards; }
    .chart-end::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
    .chart-end.arriving::after { animation: ring .7s var(--ease-out) 560ms backwards; }
    .chart-end.grown::after { animation: ring .7s var(--ease-out); }
    @keyframes pop { from { scale: 0; } }
    .chart-latest { position: absolute; left: 100%; translate: .6rem -50%; white-space: nowrap;
                    color: var(--fg); font: .75rem var(--mono); font-variant-numeric: tabular-nums; }
    .chart-latest.arriving { animation: settle var(--dur-base) var(--ease-out) 480ms backwards; }
    .chart-latest.grown { animation: rose-a 700ms var(--ease-out); }
    .chart-rule { position: absolute; top: 0; bottom: 0; width: 1px; translate: -.5px 0;
                  background: var(--muted); opacity: .5; pointer-events: none; }
    /* The hover layer is written afresh as the pointer moves, so nothing in it animates on
       appearing — it would replay with every pixel. A crosshair follows instantly anyway. */
    .chart-dot { pointer-events: none; }
    .chart-tip { position: absolute; bottom: calc(100% + .3rem); translate: -50% 0; z-index: 1;
                 display: grid; padding: .3rem .5rem; pointer-events: none; white-space: nowrap;
                 background: var(--card); border: 1px solid var(--line); border-radius: .4rem;
                 box-shadow: 0 .3rem .8rem rgba(28, 23, 20, .12); font-size: .75rem; }
    .chart-tip.start { translate: -.6rem 0; }
    .chart-tip.end { translate: calc(-100% + .6rem) 0; }
    .chart-tip strong { font: 500 .85rem var(--mono); font-variant-numeric: tabular-nums; }
    .chart-tip span { color: var(--muted); font-family: var(--mono); }
    .chart-axis { display: flex; justify-content: space-between; margin-right: 3.4rem;
                  color: var(--muted); font: .65rem var(--mono); }
    /* A state's day (timeline.rs): a strip, each block one state, as wide as it lasted. The
       colours are eight that stay apart from each other for every kind of colour vision, in a
       fixed order, stepped for each theme; the state that means nothing is going on is quiet,
       and a gap is simply left empty. A hair of the surface between blocks keeps two of the
       same lightness from running together. */
    .timeline { --tone-1: #2a78d6; --tone-2: #eb6834; --tone-3: #1baf7a; --tone-4: #eda100;
                --tone-5: #e87ba4; --tone-6: #008300; --tone-7: #4a3aa7; --tone-8: #e34948;
                --tone-off: color-mix(in srgb, var(--muted) 38%, var(--card)); --tone-other: var(--muted); }
    @media (prefers-color-scheme: dark) {
      .timeline { --tone-1: #3987e5; --tone-2: #d95926; --tone-3: #199e70; --tone-4: #c98500;
                  --tone-5: #d55181; --tone-6: #008300; --tone-7: #9085e9; --tone-8: #e66767; }
    }
    .tone-1 { background: var(--tone-1); } .tone-2 { background: var(--tone-2); }
    .tone-3 { background: var(--tone-3); } .tone-4 { background: var(--tone-4); }
    .tone-5 { background: var(--tone-5); } .tone-6 { background: var(--tone-6); }
    .tone-7 { background: var(--tone-7); } .tone-8 { background: var(--tone-8); }
    .tone-off { background: var(--tone-off); } .tone-other { background: var(--tone-other); }
    .timeline-plot { position: relative; height: 2.25rem; margin: .9rem 0 .2rem;
                     cursor: crosshair; touch-action: pan-y; border-radius: 4px; }
    .timeline-plot:focus { outline: none; }
    .timeline-plot:focus-visible { outline: 2px solid var(--ember); outline-offset: 4px; }
    .timeline-track { position: absolute; inset: 0; overflow: hidden; border-radius: 4px;
                      background: repeating-linear-gradient(135deg, transparent 0 5px,
                                  var(--line) 5px 6px);
                      animation: chart-draw 560ms var(--ease-out) both; }
    .timeline-block { position: absolute; top: 0; bottom: 0; min-width: 2px;
                      box-shadow: 0 0 0 1px var(--timeline-surface, var(--card)); }
    .entity-block > .drawer .timeline { --timeline-surface: var(--bg); }
    .timeline-axis { margin-right: 0; }
    .timeline-legend { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; margin: .7rem 0 0;
                       padding: 0; list-style: none; font-size: .8rem; }
    .timeline-legend li { display: flex; align-items: center; gap: .4rem; }
    .timeline-swatch { flex: none; width: .7rem; height: .7rem; border-radius: 3px; }
    .timeline-total { color: var(--muted); font: .7rem var(--mono);
                      font-variant-numeric: tabular-nums; }
    .chart-tip .timeline-tip-state { display: flex; align-items: center; gap: .4rem;
                                     font-family: var(--sans); }
    .chart-tip .timeline-swatch { display: inline-block; }

    /* Waiting for the day: the chart's own height, gently lit, so nothing jumps when it comes. */
    .chart-waiting { height: 9.5rem; margin: 1.3rem 4.15rem 2rem .75rem; border-radius: .4rem;
                     background: linear-gradient(90deg, var(--sunk) 30%, var(--line) 50%,
                                 var(--sunk) 70%) 0 0 / 300% 100%;
                     animation: waiting 1.4s ease-in-out infinite; }
    @keyframes waiting { from { background-position: 100% 0; } to { background-position: 0 0; } }
    .history { border-top: 1px solid var(--line); }
    .history-scroll { max-height: 14rem; overflow-y: auto; }
    table.history { width: 100%; border-collapse: collapse; font-size: .85rem; }
    table.history th, table.history td { text-align: left; padding: .3rem .75rem;
                                         border-bottom: 1px solid var(--line); }
    table.history thead th { position: sticky; top: 0; background: var(--card);
                             color: var(--muted); font: .65rem var(--mono); letter-spacing: .08em;
                             text-transform: uppercase; border-bottom: 2px solid var(--line); }
    table.history time { font: .8rem var(--mono); font-variant-numeric: tabular-nums;
                         white-space: nowrap; }
    .history-note { margin: 0; padding: .5rem .75rem; }

    /* A protocol's icon, or its initial. */
    .protocol-icon { display: inline-block; width: 20px; height: 20px; vertical-align: middle;
                        flex: none; }
    .protocol-icon.letter { display: inline-grid; place-items: center; border-radius: 4px;
                               background: var(--sunk); color: var(--muted);
                               font: 600 .7rem/1 var(--mono); }
    .description-lede { margin: -.5rem 0 .25rem; }
    /* A form of labelled fields, one under another: the Assistant's, in Settings. */
    .about-form { display: grid; gap: .75rem; }
    .about-form label { display: grid; gap: .25rem; }
    .about-form label > span { color: var(--muted); font: .7rem var(--mono); letter-spacing: .08em;
                               text-transform: uppercase; }
    .about-form input, .about-form textarea { padding: .45rem .6rem; resize: vertical; }

    /* Found, and waiting for a person: a key to paste, a code to enter. */
    .waiting { border-color: var(--ember); }
    .waiting-list { margin: 0; padding: 0; list-style: none; }
    .waiting-list li { padding: .75rem 0; border-bottom: 1px solid var(--line); }
    .waiting-list li:last-child { border-bottom: none; }
    .waiting-list .id { display: inline; }
    .waiting-list .inline-form { margin: .4rem 0 .2rem; }
    .waiting-list .inline-form input { flex: 1 1 16rem; min-width: 0; font-family: var(--mono);
                                       font-size: .85rem; }
    .why-waiting { margin: .25rem 0 0; }
    .waiting-list p { margin: .25rem 0 0; }
    .nudge { margin: 0 0 1.25rem; padding: .6rem .8rem; border: 1px dashed var(--ember);
             border-radius: .4rem; font-size: .9rem; }
    .extensions li a.small { font-size: .8rem; }

    .danger-button { padding: .4rem .75rem; font: inherit; font-size: .9rem; color: #b4342c;
                     background: transparent; border: 1px solid var(--line); border-radius: .4rem;
                     cursor: pointer; }
    .danger-button:hover { border-color: #b4342c; }
    details.ignored { margin-top: 1.5rem; }
    .inline-form input.level { width: 5rem; }
    .inline-form .add.solid { background: var(--ember); border-color: var(--ember);
        color: var(--card); }
    .inline-form .add.solid:hover { background: #ab4717; border-color: #ab4717; color: var(--card); }
    details.ignored summary { cursor: pointer; font-weight: 500; }

    .empty { color: var(--muted); }
    .muted { color: var(--muted); }
    /* Nothing on the page is a hyperlink. A control is a button; a place you can go is drawn
       as one of those, or as the sidebar and the device table draw it. */
    a { color: inherit; text-decoration: none; }
    p .quiet-button { margin: 0 .35rem; vertical-align: middle; }

    /* The start screen: the IroriOS wordmark as the terminal prints it, big enough to be the
       first thing a browser lands on. */
    .start { display: grid; gap: 1.75rem; margin-bottom: .5rem; }
    .start-wordmark { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem;
                      padding: .5rem 0 .25rem; }
    /* The page's own actions, beside the name: level with it, at the far end. */
    .start-wordmark .page-actions { align-self: flex-start; }
    .start-box { display: grid; place-items: center; width: 6rem; height: 6rem; flex: none;
                 border: 2px solid var(--fg); border-radius: .5rem; }
    .start-ember { width: 2.5rem; height: 2.5rem; border-radius: .25rem; background: var(--ember);
                   animation: embers 3.2s ease-in-out infinite; }
    /* The hearth, alive: an uneven glow rather than a steady pulse, so it reads as a fire and not
       a clock. */
    @keyframes embers {
        0%, 100% { opacity: 1; box-shadow: 0 0 1.2rem rgba(196, 85, 43, .45); }
        17% { opacity: .9; box-shadow: 0 0 .7rem rgba(196, 85, 43, .3); }
        31% { opacity: 1; box-shadow: 0 0 1.5rem rgba(196, 85, 43, .55); }
        58% { opacity: .86; box-shadow: 0 0 .8rem rgba(196, 85, 43, .3); }
        73% { opacity: .97; box-shadow: 0 0 1.35rem rgba(196, 85, 43, .5); }
    }
    .start-letters { display: grid; gap: .35rem; min-width: 0; }
    .start-title { margin: 0; font-size: 1.9rem; font-weight: 600; letter-spacing: .3em; line-height: 1.05;
                   text-indent: .3em; overflow-wrap: anywhere; }
    .start-rule { width: 9rem; border-bottom: 1px solid var(--fg); opacity: .45; }
    .start-tag { color: var(--muted); font-size: .95rem; }

    /* Settings (settings.rs): one table. Each row is a fold — an icon, a name, how it stands
       — and what it opens to sits under the name, in from the icon. */
    .icon { display: block; flex: none; width: 1rem; height: 1rem; }
    .settings-table { margin-bottom: 1.5rem; border: 1px solid var(--line); border-radius: .5rem;
                      background: var(--card); overflow: hidden; }
    .settings-table > .fold-row { scroll-margin-top: 1rem; }
    .settings-table > .fold-row > .fold-head > .fold-toggle { gap: .7rem; padding: .8rem 1rem; }
    .settings-table > .fold-row > .fold-head > .fold-toggle:hover { background: var(--sunk); }
    .settings-table > .fold-row > .fold-head .icon {
        width: 1.15rem; height: 1.15rem; color: var(--muted);
        transition: color var(--dur-base) var(--ease-out); }
    .settings-table > .fold-row.open > .fold-head .icon { color: var(--ember); }
    .settings-table > .fold-row > .fold-head .chevron { order: 9; margin: 0 .2rem 0 auto; }
    .settings-table > .fold-row > .drawer > .drawer-inner > * { margin: .1rem 1rem 1.1rem 2.85rem; }
    .setting { display: flex; align-items: flex-start; gap: 1rem; }
    .setting-words { flex: 1; min-width: 0; }
    .setting-name { font-weight: 500; }
    .setting p { margin: .15rem 0 0; }
    .log-view .log-bar { margin-top: 0; }
    .log-note { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem; margin: 0 0 .6rem; }
    .log-note p { flex: 1 1 16rem; margin: 0; }
    /* Facts: what something is, as a list of names and values. */
    .facts { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.25rem; margin: 0; }
    .facts dt { color: var(--muted); font: .7rem/1.8 var(--mono); letter-spacing: .08em;
                text-transform: uppercase; }
    .facts dd { margin: 0; font-family: var(--mono); font-size: .85rem; overflow-wrap: anywhere; }
    .facts dd .muted { font-family: var(--sans); }

    /* The machine (machine.rs): a meter for each thing that fills up. The bar grows to its
       figure when the machine answers and moves when the figure does; opened, a meter says
       what is behind the figure and draws its last day. */
    .machine { display: grid; gap: 1rem; }
    .meters { border: 1px solid var(--line); border-radius: .5rem; overflow: hidden; }
    .meter { border-bottom: 1px solid var(--line); }
    .meter:last-child { border-bottom: none; }
    .meter-head { display: grid; align-items: center; gap: .75rem; width: 100%;
                  grid-template-columns: 1.15rem 6rem 2.6rem minmax(4rem, 1fr) minmax(0, max-content) auto;
                  padding: .6rem .8rem; font: inherit; color: var(--fg); text-align: left;
                  background: transparent; border: none; cursor: pointer;
                  transition: background-color var(--dur-fast); }
    .meter-head:hover, .meter.open .meter-head { background: var(--sunk); }
    .meter-head:active { scale: 1; }
    .meter-head:focus-visible { outline: 2px solid var(--ember); outline-offset: -2px; }
    .meter-icon { color: var(--muted); }
    .meter-icon .icon { width: 1.15rem; height: 1.15rem; }
    .meter-name { font-weight: 500; }
    .meter-figure { font: .85rem var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
    .meter-bar { display: block; height: .45rem; border-radius: 1rem; background: var(--line);
                 overflow: hidden; }
    .meter-fill { display: block; height: 100%; border-radius: inherit; background: var(--ember);
                  transform-origin: left center; scale: 0 1;
                  transition: scale var(--dur-expressive) var(--ease-emphasized),
                              background-color var(--dur-base); }
    .meter-bar.high .meter-fill { background: var(--error); }
    .meter-words { color: var(--muted); font: .72rem var(--mono); white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
    .meter.open .unroll-mark { rotate: 225deg; margin-top: .25rem; }
    .meter-more { display: grid; gap: .75rem; padding: .75rem .8rem .9rem 2.7rem; }
    .volumes { display: grid; gap: .45rem; margin: 0; padding: 0; list-style: none; }
    .volumes li { display: grid; align-items: center; gap: .75rem; font: .8rem var(--mono);
                  grid-template-columns: minmax(6rem, 1.2fr) minmax(4rem, 1fr) max-content; }
